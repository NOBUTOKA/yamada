<html lang="en">
<head>
<meta charset="utf-8">
<style>
body { margin: 0; font: 13px Arial, sans-serif; color: #222; }
canvas { display: block; width: 100%; height: 74px; touch-action: none; cursor: crosshair; }
.controls { display: flex; gap: 8px; align-items: center; }
#pan { flex: 1; min-width: 0; height: 20px; overflow-x: auto; overflow-y: hidden; }
#extent { height: 1px; }
</style>
</head>
<body>
<canvas id="band" tabindex="0" aria-label="Colormap gradient and color stops"></canvas>
<div class="controls">
  <div id="pan" tabindex="0" aria-label="Horizontal scroll"><div id="extent"></div></div>
  <button id="fit" type="button">Fit</button>
</div>
<script>
function setup(component) {
    const canvas = document.getElementById("band");
    const context = canvas.getContext("2d");
    const pan = document.getElementById("pan");
    const extent = document.getElementById("extent");
    const margin = 12;
    let state = null;
    let start = 0;
    let span = 100;
    let drag = null;
    let pending = null;
    let sequence = 0;
    let suppressClick = false;

    const width = () => Math.max(canvas.clientWidth - 2 * margin, 1);
    const toX = position => margin + (position - start) * width() / span;
    const toPosition = x => start + (x - margin) * span / width();
    const clamp = (value, lo, hi) => Math.max(lo, Math.min(hi, value));
    const rgb8 = color => color.map(value => Math.round(255 * value));
    const css = color => "rgb(" + rgb8(color).join(",") + ")";
    const send = (name, data = {}) => component.sendEventToMATLAB(name, data);

    function view(left, length) {
        span = length;
        start = clamp(left, 0, 100 - span);
        extent.style.width = Math.ceil(pan.clientWidth * 100 / span) + "px";
        pan.scrollLeft = span === 100 ? 0 : start / (100 - span) * (pan.scrollWidth - pan.clientWidth);
        paint();
    }

    function currentColor(position) {
        const preview = drag || pending;
        if (preview && preview.moved) {
            const i = preview.index;
            const left = state.positions[i - 1];
            const right = state.positions[i + 1];
            if (position > left && position < right) {
                const a = position < preview.position ? i - 1 : i;
                const b = a + 1;
                const p = a === i ? preview.position : left;
                const q = b === i ? preview.position : right;
                const fraction = (position - p) / (q - p);
                return state.colors[a].map((value, channel) =>
                    value + fraction * (state.colors[b][channel] - value));
            }
        }
        const map = Array.isArray(state.map[0]) ? state.map : [state.map];
        const index = clamp(Math.floor(position * map.length / 100), 0, map.length - 1);
        return map[index];
    }

    function paint() {
        const ratio = window.devicePixelRatio || 1;
        const w = canvas.clientWidth;
        canvas.width = Math.round(w * ratio);
        canvas.height = Math.round(74 * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        if (!state) return;
        for (let x = margin; x < w - margin; x++) {
            context.fillStyle = css(currentColor(toPosition(x + 0.5)));
            context.fillRect(x, 8, 1, 34);
        }
        state.positions.forEach((position, index) => {
            const preview = drag || pending;
            const x = toX(preview && preview.index === index ? preview.position : position);
            if (x < margin - 0.5 || x > w - margin + 0.5) return;
            context.beginPath();
            context.moveTo(x, 43);
            context.lineTo(x - 5, 52);
            context.lineTo(x - 5, 63);
            context.lineTo(x + 5, 63);
            context.lineTo(x + 5, 52);
            context.closePath();
            context.fillStyle = css(state.colors[index]);
            context.fill();
            context.strokeStyle = index + 1 === state.selected ? "#1261bc" : "#333";
            context.lineWidth = index + 1 === state.selected ? 3 : 1;
            context.stroke();
        });
    }

    function hit(event) {
        if (!state || event.offsetY < 42 || event.offsetY > 68) return -1;
        let closest = -1;
        let distance = 7;
        state.positions.forEach((position, index) => {
            if (position < start || position > start + span) return;
            const dx = Math.abs(toX(position) - event.offsetX);
            if (dx < distance) { closest = index; distance = dx; }
        });
        return closest;
    }

    canvas.addEventListener("pointerdown", event => {
        if (event.button !== 0 || !state || pending) return;
        canvas.focus();
        suppressClick = false;
        const index = hit(event);
        if (index < 0) return;
        state.selected = index + 1;
        paint();
        if (index === 0 || index === state.positions.length - 1) {
            send("select", {index: index + 1});
            return;
        }
        drag = {index, position: state.positions[index], x: event.offsetX, moved: false};
        canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", event => {
        if (!drag) return;
        drag.moved ||= Math.abs(event.offsetX - drag.x) > 2;
        if (!drag.moved) return;
        const lo = state.positions[drag.index - 1];
        const hi = state.positions[drag.index + 1];
        const gap = Math.min((hi - lo) / 4, 1e-8);
        drag.position = clamp(toPosition(event.offsetX), lo + gap, hi - gap);
        paint();
    });
    canvas.addEventListener("pointerup", () => {
        if (!drag) return;
        const completed = drag;
        drag = null;
        if (completed.moved) {
            suppressClick = true;
            pending = completed;
            pending.sequence = ++sequence;
            send("move", {index: completed.index + 1, position: completed.position, sequence});
        } else {
            send("select", {index: completed.index + 1});
        }
        paint();
    });
    canvas.addEventListener("pointercancel", () => { drag = null; paint(); });
    canvas.addEventListener("click", event => {
        if (suppressClick || !state || event.offsetY < 8 || event.offsetY >= 42) return;
        const position = toPosition(event.offsetX);
        if (position > 0 && position < 100) send("add", {position});
    });
    canvas.addEventListener("contextmenu", event => {
        event.preventDefault();
        const index = hit(event);
        if (index >= 0) send("remove", {index: index + 1});
    });
    canvas.addEventListener("dblclick", event => {
        const index = hit(event);
        if (index < 0) return;
        send("pickColor", {index: index + 1});
    });
    canvas.addEventListener("keydown", event => {
        if (!state) return;
        if (event.key === "Delete") send("remove", {index: state.selected});
        else return;
        event.preventDefault();
    });
    canvas.addEventListener("wheel", event => {
        event.preventDefault();
        const fraction = clamp((event.offsetX - margin) / width(), 0, 1);
        const anchor = start + fraction * span;
        const length = clamp(span * Math.exp(clamp(event.deltaY, -150, 150) * 0.001), 0.25, 100);
        view(anchor - fraction * length, length);
    }, {passive: false});
    pan.addEventListener("scroll", () => {
        const travel = pan.scrollWidth - pan.clientWidth;
        if (travel > 0) start = pan.scrollLeft / travel * (100 - span);
        paint();
    });
    document.getElementById("fit").addEventListener("click", () => view(0, 100));
    new ResizeObserver(() => view(start, span)).observe(canvas);

    function update() {
        if (!component.Data || !component.Data.positions) return;
        state = component.Data;
        if (pending && state.acknowledgedMove >= pending.sequence) pending = null;
        paint();
    }
    component.addEventListener("DataChanged", update);
    view(0, 100);
    update();
}
</script>
</body>
</html>
