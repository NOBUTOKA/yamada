<html>
<head>
<meta charset="utf-8">
<style>
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
body { position: relative; }
svg { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; overflow: hidden; background: transparent; }
#tab-controls { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
#grid-controls { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.tab-selector { position: absolute; box-sizing: border-box; height: 22px; pointer-events: auto; font: 11px Arial; }
.grid-frame { position: absolute; box-sizing: border-box; border: 1px solid rgba(34, 100, 199, 0.55); pointer-events: none; }
.grid-separator { position: absolute; box-sizing: border-box; z-index: 1; border-color: rgba(34, 100, 199, 0.20); border-style: dotted; pointer-events: none; }
.grid-separator.horizontal { border-top-width: 1px; }
.grid-separator.vertical { border-left-width: 1px; }
.track-settings { position: absolute; z-index: 4; box-sizing: border-box; width: 12px; height: 12px; padding: 0; border: 1px solid rgba(40, 100, 199, 0.56); border-radius: 3px; background: rgba(248, 251, 255, 0.88); color: #124da8; pointer-events: auto; font: 9px Arial; line-height: 10px; }
.track-settings.locked { border-color: #8b8b8b; background: rgba(244, 244, 244, 0.88); color: #666666; }
.track-popover { position: absolute; z-index: 5; box-sizing: border-box; width: min(244px, calc(100% - 8px)); max-width: 244px; padding: 8px; border: 1px solid #2864c7; border-radius: 4px; background: #ffffff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); pointer-events: auto; font: 11px Arial; }
.track-popover label { display: block; margin: 4px 0; }
.track-popover select, .track-popover input { width: 100%; box-sizing: border-box; margin-top: 2px; }
.track-popover-actions { display: grid; grid-template-columns: 1fr; gap: 5px; margin-top: 8px; }
.track-popover-footer { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; margin-top: 5px; }
.track-popover-actions button, .track-popover-footer button { min-width: 0; white-space: normal; }
.track-popover-error { min-height: 12px; margin-top: 4px; color: #b00020; font-size: 10px; }
.grid-status { position: absolute; max-width: 230px; padding: 4px 6px; border-radius: 3px; background: rgba(255, 248, 225, 0.95); color: #6c5500; font: 10px Arial; }
.grid-child { position: absolute; z-index: 2; box-sizing: border-box; border: 1px solid transparent; background: transparent; pointer-events: auto; }
.grid-selection-target { position: absolute; z-index: 1; box-sizing: border-box; background: transparent; pointer-events: auto; }
.grid-drop-band { position: absolute; z-index: 1; box-sizing: border-box; border: 1px dashed rgba(18, 77, 168, 0.7); background: rgba(18, 77, 168, 0.06); pointer-events: none; }
.grid-child.selected { border: 2px solid rgba(18, 77, 168, 0.85); }
.grid-child.selected.editable { pointer-events: auto; cursor: move; }
.grid-span-handle { position: absolute; z-index: 3; width: 8px; height: 8px; box-sizing: border-box; border: 1px solid #ffffff; border-radius: 2px; background: #2864c7; pointer-events: auto; }
.grid-span-handle.top { left: 50%; top: -5px; margin-left: -4px; cursor: n-resize; }
.grid-span-handle.bottom { left: 50%; bottom: -5px; margin-left: -4px; cursor: s-resize; }
.grid-span-handle.left { left: -5px; top: 50%; margin-top: -4px; cursor: w-resize; }
.grid-span-handle.right { right: -5px; top: 50%; margin-top: -4px; cursor: e-resize; }
.grid-span-handle.top-left { left: -5px; top: -5px; cursor: nw-resize; }
.grid-span-handle.top-right { right: -5px; top: -5px; cursor: ne-resize; }
.grid-span-handle.bottom-left { left: -5px; bottom: -5px; cursor: sw-resize; }
.grid-span-handle.bottom-right { right: -5px; bottom: -5px; cursor: se-resize; }
.grid-child-draft { position: absolute; z-index: 3; box-sizing: border-box; border: 2px dashed #2864c7; background: transparent; pointer-events: none; }
.silhouette { fill: none; stroke: #2864c7; stroke-width: 1.25; stroke-dasharray: 4 3; pointer-events: all; }
.tab-group-frame { pointer-events: stroke; }
.tab-group-header { fill: rgba(0, 0, 0, 0.001); stroke: transparent; pointer-events: all; }
.selected { stroke: #124da8; stroke-width: 2; }
.handle { fill: #2864c7; stroke: #ffffff; stroke-width: 1; pointer-events: all; }
</style>
<script>
var component;
var svg;
var currentData = { width: 1, height: 1, components: [], gridSelectionTargets: [] };
var gridGesture = null;

function setup(htmlComponent) {
  component = htmlComponent;
  svg = document.getElementById("overlay");
  htmlComponent.addEventListener("DataChanged", function(event) {
    currentData = event.Data || currentData;
    render();
  });
  svg.addEventListener("pointerdown", sendPointerEvent);
  svg.addEventListener("pointermove", sendPointerEvent);
  svg.addEventListener("pointerup", sendPointerEvent);
  svg.addEventListener("pointercancel", sendPointerEvent);
}

function sendPointerEvent(event) {
  var rect = svg.getBoundingClientRect();
  var target = event.target;
  var x = event.clientX - rect.left;
  var y = event.clientY - rect.top;
  if (event.type === "pointerdown") {
    svg.setPointerCapture(event.pointerId);
  }
  if (event.type === "pointerup" || event.type === "pointercancel") {
    if (svg.hasPointerCapture(event.pointerId)) {
      svg.releasePointerCapture(event.pointerId);
    }
  }
  component.sendEventToMATLAB("Pointer", {
    phase: event.type,
    x: x,
    y: rect.height - y,
    componentId: target.dataset.componentId || "",
    handle: target.dataset.handle || "",
    tabIndex: 0
  });
}

function renderTabControls(components) {
  var controls = document.getElementById("tab-controls");
  controls.innerHTML = "";
  components.forEach(function(item) {
    if (!item.tabGroup || !item.tabTitles || item.tabTitles.length === 0) return;
    var selector = document.createElement("select");
    selector.className = "tab-selector";
    var controlWidth = Math.min(110, item.width);
    selector.style.left = (item.x + item.width - controlWidth) + "px";
    selector.style.top = (currentData.height - item.y - item.height + 3) + "px";
    selector.style.width = controlWidth + "px";
    selector.dataset.componentId = item.id;
    item.tabTitles.forEach(function(title, index) {
      var option = document.createElement("option");
      option.value = String(index + 1);
      option.textContent = String(title);
      selector.appendChild(option);
    });
    selector.value = String(item.tabSelected || 1);
    selector.addEventListener("change", function() {
      component.sendEventToMATLAB("Pointer", {
        phase: "tabselect", componentId: item.id,
        tabIndex: Number(selector.value), x: 0, y: 0, handle: ""
      });
    });
    controls.appendChild(selector);
  });
}

function renderGridSelectionTargets(targets, gridData) {
  var controls = document.getElementById("grid-controls");
  componentArray(targets).sort(function(first, second) {
    return Number(first.depth || 0) - Number(second.depth || 0);
  }).forEach(function(target) {
    if (!target || !target.id || !target.gridId ||
        (gridData && String(gridData.activeGridId || "") === String(target.gridId))) return;
    if (!Number.isFinite(Number(target.x)) || !Number.isFinite(Number(target.y)) ||
        Number(target.width) <= 0 || Number(target.height) <= 0) return;
    var hitTarget = document.createElement("div");
    hitTarget.className = "grid-selection-target";
    hitTarget.style.left = Number(target.x) + "px";
    hitTarget.style.top = (currentData.height - Number(target.y) - Number(target.height)) + "px";
    hitTarget.style.width = Number(target.width) + "px";
    hitTarget.style.height = Number(target.height) + "px";
    hitTarget.style.zIndex = String(1 + Number(target.depth || 0));
    hitTarget.title = "Select grid child";
    hitTarget.addEventListener("pointerdown", function(event) {
      event.preventDefault();
      event.stopPropagation();
      component.sendEventToMATLAB("GridAction", {
        action: "select-child", revision: Number(gridData ? gridData.revision : currentData.revision),
        activeGridId: target.gridId, childId: target.id
      });
    });
    controls.appendChild(hitTarget);
  });
}

function renderGridEditor(data) {
  var controls = document.getElementById("grid-controls");
  if (!data || !data.activeGridId || !data.outerBounds || data.outerBounds.length !== 4) return;
  var outer = data.outerBounds;
  var inner = data.innerBounds;
  if (outer[2] <= 0 || outer[3] <= 0 || inner[2] <= 0 || inner[3] <= 0) return;
  function addBox(className, bounds) {
    var box = document.createElement("div");
    box.className = className;
    box.style.left = bounds[0] + "px";
    box.style.top = (currentData.height - bounds[1] - bounds[3]) + "px";
    box.style.width = bounds[2] + "px";
    box.style.height = bounds[3] + "px";
    controls.appendChild(box);
  }
  addBox("grid-frame", outer);
  function addSeparator(className, left, top, width, height) {
    var separator = document.createElement("div");
    separator.className = "grid-separator " + className;
    separator.style.left = left + "px";
    separator.style.top = top + "px";
    separator.style.width = width + "px";
    separator.style.height = height + "px";
    controls.appendChild(separator);
  }
  function addTrackDividers(axis, tracks) {
    var list = componentArray(tracks);
    for (var index = 0; index + 1 < list.length; index += 1) {
      var first = list[index];
      var second = list[index + 1];
      if (!first.bounds || !second.bounds || first.bounds.length !== 4 || second.bounds.length !== 4) continue;
      if (axis === "row") {
        var upperBottom = Number(first.bounds[1]);
        var lowerTop = Number(second.bounds[1]) + Number(second.bounds[3]);
        if (!Number.isFinite(upperBottom) || !Number.isFinite(lowerTop)) continue;
        addSeparator("horizontal", inner[0], currentData.height - (upperBottom + lowerTop) / 2, inner[2], 0);
      } else {
        var leftEdge = Number(first.bounds[0]) + Number(first.bounds[2]);
        var rightEdge = Number(second.bounds[0]);
        if (!Number.isFinite(leftEdge) || !Number.isFinite(rightEdge)) continue;
        addSeparator("vertical", (leftEdge + rightEdge) / 2, currentData.height - inner[1] - inner[3], 0, inner[3]);
      }
    }
  }
  addTrackDividers("row", data.rowTracks);
  addTrackDividers("column", data.columnTracks);
  function collapsedBand(axis, track, tracks) {
    var extent = axis === "row" ? Number(track.bounds[3]) : Number(track.bounds[2]);
    var anchor = axis === "row" ? Number(track.bounds[1]) : Number(track.bounds[0]);
    if (extent > 0.5) return null;
    var matching = componentArray(tracks).filter(function(candidate) {
      var candidateExtent = axis === "row" ? Number(candidate.bounds[3]) : Number(candidate.bounds[2]);
      var candidateAnchor = axis === "row" ? Number(candidate.bounds[1]) : Number(candidate.bounds[0]);
      return candidateExtent <= 0.5 && Math.abs(candidateAnchor - anchor) <= 0.5;
    });
    var order = matching.findIndex(function(candidate) { return Number(candidate.index) === Number(track.index); });
    var size = 8;
    var center = anchor + (order - (matching.length - 1) / 2) * size;
    return { start: center - size / 2, end: center + size / 2 };
  }
  function addHeader(axis, track) {
    var hasBounds = !!track.bounds && track.bounds.length === 4 &&
      Number.isFinite(Number(track.bounds[0])) && Number.isFinite(Number(track.bounds[1])) &&
      Number(track.bounds[2]) >= 0 && Number(track.bounds[3]) >= 0;
    if (!hasBounds) return;
    var header = document.createElement("button");
    header.type = "button";
    var editable = !!track.editable && !!data.editable;
    header.className = "track-settings" + (editable ? "" : " locked");
    header.dataset.gridId = data.activeGridId;
    header.dataset.axis = axis;
    header.dataset.index = String(track.index);
    var trackName = (axis === "row" ? "row " : "column ") + String(track.index);
    header.title = editable ? "Edit " + trackName : String(data.readOnlyReason || "Track editing is unavailable.");
    header.setAttribute("aria-label", editable ? "Edit " + trackName : "Track editing is unavailable.");
    header.textContent = "\u2699";
    if (editable) {
      header.addEventListener("pointerdown", function(event) { event.stopPropagation(); });
      header.addEventListener("click", function(event) {
        event.stopPropagation();
        openTrackPopover(header, data, axis, track);
      });
    }
    var buttonSize = 12;
    var railGap = 0;
    var leftRail = Number(outer[0]) - railGap - buttonSize;
    var rightRail = Number(outer[0]) + Number(outer[2]) + railGap;
    var topRail = currentData.height - Number(outer[1]) - Number(outer[3]) - railGap - buttonSize;
    var bottomRail = currentData.height - Number(outer[1]) + railGap;
    var rowRail = leftRail >= 0 ? leftRail :
      (rightRail + buttonSize <= currentData.width ? rightRail : null);
    var columnRail = topRail >= 0 ? topRail :
      (bottomRail + buttonSize <= currentData.height ? bottomRail : null);
    if (axis === "row" && rowRail === null) return;
    if (axis === "column" && columnRail === null) return;
    if (axis === "row") {
      var rowBand = collapsedBand(axis, track, data.rowTracks);
      var rowCenter = rowBand ? (rowBand.start + rowBand.end) / 2 :
        Number(track.bounds[1]) + Number(track.bounds[3]) / 2;
      header.style.left = rowRail + "px";
      header.style.top = Math.max(0, Math.min(currentData.height - buttonSize,
        currentData.height - rowCenter - buttonSize / 2)) + "px";
    } else {
      var columnBand = collapsedBand(axis, track, data.columnTracks);
      var columnCenter = columnBand ? (columnBand.start + columnBand.end) / 2 :
        Number(track.bounds[0]) + Number(track.bounds[2]) / 2;
      header.style.left = Math.max(0, Math.min(currentData.width - buttonSize,
        columnCenter - buttonSize / 2)) + "px";
      header.style.top = columnRail + "px";
    }
    controls.appendChild(header);
  }
  componentArray(data.rowTracks).forEach(function(track) { addHeader("row", track); });
  componentArray(data.columnTracks).forEach(function(track) { addHeader("column", track); });
  componentArray(data.children).forEach(function(child) {
    if (!child.bounds || child.bounds.length !== 4 || child.bounds[2] <= 0 || child.bounds[3] <= 0) return;
    var childBox = document.createElement("div");
    var childEditable = !!child.selected && !!child.editable && !!data.editable;
    childBox.className = "grid-child" + (child.selected ? " selected" : "") +
      (childEditable ? " editable" : "");
    childBox.style.left = child.bounds[0] + "px";
    childBox.style.top = (currentData.height - child.bounds[1] - child.bounds[3]) + "px";
    childBox.style.width = child.bounds[2] + "px";
    childBox.style.height = child.bounds[3] + "px";
    childBox.title = String(child.placementMode || "implicit") + " R" +
      String(child.rowStart || "?") + " C" + String(child.columnStart || "?");
    childBox.addEventListener("pointerdown", function(event) {
      if (!child.selected) {
        selectGridChild(event, data, child);
      } else if (childEditable) {
        beginGridChildGesture(event, data, child, "move");
      }
    });
    if (childEditable) {
      ["top", "bottom", "left", "right", "top-left", "top-right", "bottom-left", "bottom-right"].forEach(function(kind) {
        var handle = document.createElement("div");
        handle.className = "grid-span-handle " + kind;
        handle.title = "Resize grid span";
        handle.addEventListener("pointerdown", function(event) {
          beginGridChildGesture(event, data, child, kind);
        });
        childBox.appendChild(handle);
      });
    }
    controls.appendChild(childBox);
  });
  if (data.readOnlyReason) {
    var status = document.createElement("div");
    status.className = "grid-status";
    status.style.left = Math.max(0, outer[0]) + "px";
    status.style.top = Math.min(currentData.height - 24, currentData.height - outer[1] + 4) + "px";
    status.textContent = String(data.readOnlyReason);
    controls.appendChild(status);
  }
}

function gridPoint(event) {
  var rect = document.getElementById("overlay").getBoundingClientRect();
  return { x: event.clientX - rect.left, y: rect.height - (event.clientY - rect.top) };
}

function collapsedTrackBand(axis, track, tracks) {
  var bounds = track.bounds || [];
  var extent = axis === "row" ? Number(bounds[3]) : Number(bounds[2]);
  var anchor = axis === "row" ? Number(bounds[1]) : Number(bounds[0]);
  if (bounds.length !== 4 || extent > 0.5 || !Number.isFinite(anchor)) return null;
  var matching = componentArray(tracks).filter(function(candidate) {
    var candidateBounds = candidate.bounds || [];
    var candidateExtent = axis === "row" ? Number(candidateBounds[3]) : Number(candidateBounds[2]);
    var candidateAnchor = axis === "row" ? Number(candidateBounds[1]) : Number(candidateBounds[0]);
    return candidateBounds.length === 4 && candidateExtent <= 0.5 &&
      Math.abs(candidateAnchor - anchor) <= 0.5;
  });
  var order = matching.findIndex(function(candidate) { return Number(candidate.index) === Number(track.index); });
  var size = 8;
  var center = anchor + (order - (matching.length - 1) / 2) * size;
  return { start: center - size / 2, end: center + size / 2 };
}

function axisTrackAt(tracks, value, axis) {
  var collapsed = componentArray(tracks).find(function(track) {
    var band = collapsedTrackBand(axis, track, tracks);
    return band && value >= band.start && value <= band.end;
  });
  if (collapsed) return Number(collapsed.index);
  var positive = componentArray(tracks).find(function(track) {
    var bounds = track.bounds || [];
    var start = axis === "row" ? Number(bounds[1]) : Number(bounds[0]);
    var extent = axis === "row" ? Number(bounds[3]) : Number(bounds[2]);
    return bounds.length === 4 && extent > 0.5 && value >= start && value <= start + extent;
  });
  return positive ? Number(positive.index) : 0;
}

function gridCellAt(data, point) {
  var row = axisTrackAt(data.rowTracks, point.y, "row");
  var column = axisTrackAt(data.columnTracks, point.x, "column");
  return row > 0 && column > 0 ? { row: row, column: column } : null;
}

function showCollapsedDropBands(data) {
  var controls = document.getElementById("grid-controls");
  componentArray(data.rowTracks).forEach(function(track) {
    var band = collapsedTrackBand("row", track, data.rowTracks);
    if (!band) return;
    var element = document.createElement("div");
    element.className = "grid-drop-band";
    element.style.left = Number(data.innerBounds[0]) + "px";
    element.style.top = (currentData.height - band.end) + "px";
    element.style.width = Number(data.innerBounds[2]) + "px";
    element.style.height = (band.end - band.start) + "px";
    element.title = "Drop in row " + String(track.index);
    controls.appendChild(element);
  });
  componentArray(data.columnTracks).forEach(function(track) {
    var band = collapsedTrackBand("column", track, data.columnTracks);
    if (!band) return;
    var element = document.createElement("div");
    element.className = "grid-drop-band";
    element.style.left = band.start + "px";
    element.style.top = (currentData.height - Number(data.innerBounds[1]) - Number(data.innerBounds[3])) + "px";
    element.style.width = (band.end - band.start) + "px";
    element.style.height = Number(data.innerBounds[3]) + "px";
    element.title = "Drop in column " + String(track.index);
    controls.appendChild(element);
  });
}

function gridSpanBounds(data, candidate) {
  var rows = componentArray(data.rowTracks);
  var columns = componentArray(data.columnTracks);
  var firstRow = rows[candidate.rowStart - 1];
  var lastRow = rows[candidate.rowEnd - 1];
  var firstColumn = columns[candidate.columnStart - 1];
  var lastColumn = columns[candidate.columnEnd - 1];
  if (!firstRow || !lastRow || !firstColumn || !lastColumn) return null;
  var left = firstColumn.bounds[0];
  var right = lastColumn.bounds[0] + lastColumn.bounds[2];
  var bottom = lastRow.bounds[1];
  var top = firstRow.bounds[1] + firstRow.bounds[3];
  return [left, bottom, right - left, top - bottom];
}

function sameGridSpan(first, second) {
  return first.rowStart === second.rowStart && first.rowEnd === second.rowEnd &&
    first.columnStart === second.columnStart && first.columnEnd === second.columnEnd;
}

function candidateGridSpan(gesture, point) {
  var target = gridCellAt(gesture.data, point);
  if (!target) return null;
  var candidate = {
    rowStart: Number(gesture.child.rowStart), rowEnd: Number(gesture.child.rowEnd),
    columnStart: Number(gesture.child.columnStart), columnEnd: Number(gesture.child.columnEnd)
  };
  if (gesture.kind === "move") {
    candidate.rowStart += target.row - gesture.startCell.row;
    candidate.rowEnd += target.row - gesture.startCell.row;
    candidate.columnStart += target.column - gesture.startCell.column;
    candidate.columnEnd += target.column - gesture.startCell.column;
  } else {
    if (gesture.kind.indexOf("top") >= 0) candidate.rowStart = target.row;
    if (gesture.kind.indexOf("bottom") >= 0) candidate.rowEnd = target.row;
    if (gesture.kind.indexOf("left") >= 0) candidate.columnStart = target.column;
    if (gesture.kind.indexOf("right") >= 0) candidate.columnEnd = target.column;
  }
  if (candidate.rowStart < 1 || candidate.columnStart < 1 ||
      candidate.rowEnd < candidate.rowStart || candidate.columnEnd < candidate.columnStart ||
      candidate.rowEnd > componentArray(gesture.data.rowTracks).length ||
      candidate.columnEnd > componentArray(gesture.data.columnTracks).length) return null;
  return candidate;
}

function updateGridChildDraft() {
  if (!gridGesture || !gridGesture.candidate) return;
  var bounds = gridSpanBounds(gridGesture.data, gridGesture.candidate);
  if (!bounds) return;
  var draft = gridGesture.draft;
  var width = Math.max(2, bounds[2]);
  var height = Math.max(2, bounds[3]);
  draft.style.left = (bounds[0] - (width - bounds[2]) / 2) + "px";
  draft.style.top = (currentData.height - bounds[1] - bounds[3] - (height - bounds[3]) / 2) + "px";
  draft.style.width = width + "px";
  draft.style.height = height + "px";
}

function finishGridChildGesture(commit) {
  if (!gridGesture) return;
  var gesture = gridGesture;
  gridGesture = null;
  document.removeEventListener("pointermove", moveGridChildGesture);
  document.removeEventListener("pointerup", finishGridChildPointer);
  document.removeEventListener("pointercancel", cancelGridChildGesture);
  document.removeEventListener("keydown", cancelGridChildKey);
  if (gesture.draft.parentNode) gesture.draft.remove();
  document.querySelectorAll(".grid-drop-band").forEach(function(element) { element.remove(); });
  if (!commit || !gesture.candidate || sameGridSpan(gesture.child, gesture.candidate)) return;
  component.sendEventToMATLAB("GridAction", {
    action: gesture.kind === "move" ? "move-child" : "resize-span",
    revision: gesture.data.revision, activeGridId: gesture.data.activeGridId,
    childId: gesture.child.id, rowStart: gesture.candidate.rowStart,
    rowEnd: gesture.candidate.rowEnd, columnStart: gesture.candidate.columnStart,
    columnEnd: gesture.candidate.columnEnd
  });
}

function moveGridChildGesture(event) {
  if (!gridGesture) return;
  var candidate = candidateGridSpan(gridGesture, gridPoint(event));
  if (!candidate) return;
  gridGesture.candidate = candidate;
  updateGridChildDraft();
}

function finishGridChildPointer(event) {
  if (gridGesture) {
    moveGridChildGesture(event);
    finishGridChildGesture(true);
  }
}

function cancelGridChildGesture() { finishGridChildGesture(false); }

function cancelGridChildKey(event) {
  if (event.key === "Escape") {
    event.preventDefault();
    finishGridChildGesture(false);
  }
}

function beginGridChildGesture(event, data, child, kind) {
  event.preventDefault();
  event.stopPropagation();
  if (gridGesture || !data.geometryAvailable || !child.editable || !data.editable) return;
  var startCell = gridCellAt(data, gridPoint(event));
  if (!startCell) return;
  var draft = document.createElement("div");
  draft.className = "grid-child-draft";
  document.getElementById("grid-controls").appendChild(draft);
  gridGesture = { data: data, child: child, kind: kind, startCell: startCell, draft: draft,
    candidate: { rowStart: Number(child.rowStart), rowEnd: Number(child.rowEnd),
      columnStart: Number(child.columnStart), columnEnd: Number(child.columnEnd) } };
  showCollapsedDropBands(data);
  updateGridChildDraft();
  document.addEventListener("pointermove", moveGridChildGesture);
  document.addEventListener("pointerup", finishGridChildPointer);
  document.addEventListener("pointercancel", cancelGridChildGesture);
  document.addEventListener("keydown", cancelGridChildKey);
}

function selectGridChild(event, data, child) {
  event.preventDefault();
  event.stopPropagation();
  component.sendEventToMATLAB("GridAction", {
    action: "select-child", revision: data.revision, activeGridId: data.activeGridId,
    childId: child.id
  });
}

function closeTrackPopover() {
  var popover = document.getElementById("track-popover");
  if (popover) popover.remove();
}

function openTrackPopover(header, data, axis, track) {
  closeTrackPopover();
  var popover = document.createElement("div");
  popover.id = "track-popover";
  popover.className = "track-popover";
  var title = document.createElement("div");
  title.textContent = (axis === "row" ? "Row " : "Column ") + String(track.index);
  var modeLabel = document.createElement("label");
  modeLabel.textContent = "Mode";
  var mode = document.createElement("select");
  ["fit", "fixed", "flexible"].forEach(function(kind) {
    var option = document.createElement("option");
    option.value = kind;
    option.textContent = kind === "fit" ? "Fit" : (kind === "fixed" ? "Fixed px" : "Flexible x");
    option.selected = kind === track.kind;
    mode.appendChild(option);
  });
  modeLabel.appendChild(mode);
  var valueLabel = document.createElement("label");
  valueLabel.textContent = "Value";
  var value = document.createElement("input");
  value.type = "number";
  value.min = "0";
  value.step = "any";
  value.value = String(track.value || 0);
  value.disabled = mode.value === "fit";
  valueLabel.appendChild(value);
  var error = document.createElement("div");
  error.className = "track-popover-error";
  var actions = document.createElement("div");
  actions.className = "track-popover-actions";
  var insertBefore = document.createElement("button");
  insertBefore.type = "button";
  insertBefore.textContent = axis === "row" ? "Insert Row Above" : "Insert Column Left";
  var insertAfter = document.createElement("button");
  insertAfter.type = "button";
  insertAfter.textContent = axis === "row" ? "Insert Row Below" : "Insert Column Right";
  var remove = document.createElement("button");
  remove.type = "button";
  remove.textContent = axis === "row" ? "Delete Row" : "Delete Column";
  var cancel = document.createElement("button");
  cancel.type = "button";
  cancel.textContent = "Cancel";
  var apply = document.createElement("button");
  apply.type = "button";
  apply.textContent = "Apply";
  actions.appendChild(insertBefore);
  actions.appendChild(insertAfter);
  actions.appendChild(remove);
  var footer = document.createElement("div");
  footer.className = "track-popover-footer";
  footer.appendChild(cancel);
  footer.appendChild(apply);
  popover.appendChild(title);
  popover.appendChild(modeLabel);
  popover.appendChild(valueLabel);
  popover.appendChild(error);
  popover.appendChild(actions);
  popover.appendChild(footer);
  popover.addEventListener("pointerdown", function(event) { event.stopPropagation(); });
  mode.addEventListener("change", function() { value.disabled = mode.value === "fit"; });
  cancel.addEventListener("click", closeTrackPopover);
  function structural(action, targetIndex) {
    component.sendEventToMATLAB("GridAction", {
      action: action, revision: data.revision, activeGridId: data.activeGridId,
      axis: axis, index: targetIndex, fromIndex: Number(track.index), mode: "fit", value: 0
    });
    closeTrackPopover();
  }
  insertBefore.addEventListener("click", function() { structural("insert-track", Number(track.index)); });
  insertAfter.addEventListener("click", function() { structural("insert-track", Number(track.index) + 1); });
  remove.addEventListener("click", function() { structural("delete-track", Number(track.index)); });
  function submit() {
    var amount = Number(value.value);
    if (mode.value !== "fit" && (!Number.isFinite(amount) || amount < 0)) {
      error.textContent = "Enter a finite nonnegative number.";
      return;
    }
    component.sendEventToMATLAB("GridAction", {
      action: "set-track", revision: data.revision, activeGridId: data.activeGridId,
      axis: axis, index: Number(track.index), mode: mode.value,
      value: mode.value === "fit" ? 0 : amount
    });
    closeTrackPopover();
  }
  apply.addEventListener("click", submit);
  popover.addEventListener("keydown", function(event) {
    if (event.key === "Escape") { event.preventDefault(); closeTrackPopover(); }
    if (event.key === "Enter") { event.preventDefault(); submit(); }
  });
  document.getElementById("grid-controls").appendChild(popover);
  placeTrackPopover(header, popover);
  if (!value.disabled) value.focus();
}

function placeTrackPopover(header, popover) {
  var controls = document.getElementById("grid-controls");
  var margin = 4;
  var width = popover.offsetWidth;
  var height = popover.offsetHeight;
  var maxLeft = Math.max(margin, controls.clientWidth - width - margin);
  var maxTop = Math.max(margin, controls.clientHeight - height - margin);
  var left = Math.max(margin, Math.min(maxLeft, header.offsetLeft));
  var below = header.offsetTop + header.offsetHeight + margin;
  var above = header.offsetTop - height - margin;
  var top = below + height <= controls.clientHeight - margin ? below : above;
  top = Math.max(margin, Math.min(maxTop, top));
  popover.style.left = left + "px";
  popover.style.top = top + "px";
}

function svgElement(name, attributes) {
  var element = document.createElementNS("http://www.w3.org/2000/svg", name);
  var key;
  for (key in attributes) {
    if (Object.prototype.hasOwnProperty.call(attributes, key)) {
      element.setAttribute(key, attributes[key]);
    }
  }
  return element;
}

function withAttributes(base, extra) {
  var result = {};
  var key;
  for (key in base) result[key] = base[key];
  for (key in extra) result[key] = extra[key];
  return result;
}

function outline(componentData) {
  var x = componentData.x;
  var y = currentData.height - componentData.y - componentData.height;
  var w = componentData.width;
  var h = componentData.height;
  var common = { class: "silhouette" + (componentData.selected ? " selected" : ""), "data-component-id": componentData.id };
  if (componentData.tabGroup) {
    var tabHeight = Math.min(32, h);
    var group = svgElement("g", common);
    group.appendChild(svgElement("rect", withAttributes(common, { class: common.class + " tab-group-frame", x: x, y: y, width: w, height: h })));
    group.appendChild(svgElement("rect", withAttributes(common, { class: common.class + " tab-group-header", x: x, y: y, width: w, height: tabHeight })));
    return group;
  }
  if (componentData.shape === "circle") {
    return svgElement("circle", withAttributes(common, { cx: x + w / 2, cy: y + h / 2, r: Math.min(w, h) / 2 }));
  }
  if (componentData.shape === "quarterCircle") {
    return svgElement("path", withAttributes(common, { d: "M " + (x + w) + " " + (y + h) + " L " + (x + w) + " " + y + " A " + w + " " + h + " 0 0 0 " + x + " " + (y + h) + " Z" }));
  }
  if (componentData.shape === "semicircle") {
    return svgElement("path", withAttributes(common, { d: "M " + x + " " + (y + h) + " A " + (w / 2) + " " + (w / 2) + " 0 0 1 " + (x + w) + " " + (y + h) + " Z" }));
  }
  if (componentData.shape === "slider") {
    var group = svgElement("g", common);
    group.appendChild(svgElement("rect", withAttributes(common, { x: x, y: y, width: w, height: h })));
    group.appendChild(svgElement("line", withAttributes(common, { x1: x + 6, y1: y + h / 2, x2: x + w - 6, y2: y + h / 2 })));
    group.appendChild(svgElement("circle", withAttributes(common, { cx: x + w / 2, cy: y + h / 2, r: Math.min(7, h / 2) })));
    return group;
  }
  if (componentData.shape === "switch") {
    var group = svgElement("g", common);
    group.appendChild(svgElement("rect", withAttributes(common, { x: x, y: y, width: w, height: h, rx: h * 0.5 })));
    group.appendChild(svgElement("circle", withAttributes(common, { cx: x + w * 0.25, cy: y + h * 0.5, r: h * 0.36 })));
    return group;
  }
  if (componentData.shape === "rockerSwitch") {
    var rocker = svgElement("g", common);
    rocker.appendChild(svgElement("rect", withAttributes(common, { x: x, y: y, width: w, height: h, rx: w * 0.5 })));
    rocker.appendChild(svgElement("line", withAttributes(common, { x1: x, y1: y + h / 2, x2: x + w, y2: y + h / 2 })));
    return rocker;
  }
  if (componentData.shape === "toggleSwitch") {
    var toggle = svgElement("g", common);
    toggle.appendChild(svgElement("rect", withAttributes(common, { x: x, y: y, width: w, height: h, rx: w * 0.5 })));
    toggle.appendChild(svgElement("circle", withAttributes(common, { cx: x + w / 2, cy: y + h * 0.25, r: Math.min(w * 0.35, h * 0.2) })));
    return toggle;
  }
  if (componentData.shape === "axes") {
    var group = svgElement("g", common);
    group.appendChild(svgElement("rect", withAttributes(common, { x: x, y: y, width: w, height: h })));
    group.appendChild(svgElement("line", withAttributes(common, { x1: x + w * 0.12, y1: y + h * 0.86, x2: x + w * 0.9, y2: y + h * 0.86 })));
    group.appendChild(svgElement("line", withAttributes(common, { x1: x + w * 0.12, y1: y + h * 0.86, x2: x + w * 0.12, y2: y + h * 0.1 })));
    return group;
  }
  return svgElement("rect", withAttributes(common, { x: x, y: y, width: w, height: h, rx: componentData.shape === "roundedRectangle" ? 8 : 0 }));
}

function addHandles(componentData) {
  if (!componentData.selected) return;
  var x = componentData.x;
  var y = currentData.height - componentData.y - componentData.height;
  var w = componentData.width;
  var h = componentData.height;
  var positions = { sw: [x, y + h], s: [x + w / 2, y + h], se: [x + w, y + h], w: [x, y + h / 2], e: [x + w, y + h / 2], nw: [x, y], n: [x + w / 2, y], ne: [x + w, y] };
  var name;
  for (name in positions) {
    var point = positions[name];
    svg.appendChild(svgElement("rect", { class: "handle", x: point[0] - 4, y: point[1] - 4, width: 8, height: 8, "data-component-id": componentData.id, "data-handle": name }));
  }
}

function componentArray(value) {
  if (!value) return [];
  if (Array.isArray(value)) return value;
  return [value];
}

function render() {
  if (!svg) return;
  closeTrackPopover();
  svg.innerHTML = "";
  document.getElementById("grid-controls").innerHTML = "";
  renderTabControls(componentArray(currentData.components));
  renderGridSelectionTargets(componentArray(currentData.gridSelectionTargets), currentData.gridEditor);
  renderGridEditor(currentData.gridEditor);
  svg.setAttribute("viewBox", "0 0 " + (currentData.width || 1) + " " + (currentData.height || 1));
  var components = componentArray(currentData.components);
  components.forEach(function(componentData) { svg.appendChild(outline(componentData)); });
  components.forEach(function(componentData) { addHandles(componentData); });
}
</script>
</head>
<body><div id="tab-controls"></div><div id="grid-controls"></div><svg id="overlay"></svg></body>
