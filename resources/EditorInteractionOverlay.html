<html>
<head>
<meta charset="utf-8">
<style>
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
body { position: relative; }
svg { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; overflow: hidden; background: transparent; }
#tab-controls { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
#grid-controls { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.grid-controls-layer { position: absolute; inset: 0; pointer-events: none; }
.tab-selector { position: absolute; box-sizing: border-box; height: 22px; pointer-events: auto; font: 11px Arial; }
.grid-frame { position: absolute; box-sizing: border-box; border: 1px solid rgba(34, 100, 199, 0.55); pointer-events: none; }
.grid-separator { position: absolute; box-sizing: border-box; z-index: 1; border-color: rgba(34, 100, 199, 0.20); border-style: dotted; pointer-events: none; }
.grid-separator.horizontal { border-top-width: 1px; }
.grid-separator.vertical { border-left-width: 1px; }
.track-settings { position: absolute; z-index: 4; box-sizing: border-box; width: 12px; height: 12px; padding: 0; border: 1px solid rgba(40, 100, 199, 0.56); border-radius: 3px; background: rgba(248, 251, 255, 0.88); color: #124da8; pointer-events: auto; font: 9px Arial; line-height: 10px; }
.track-settings.locked { border-color: #8b8b8b; background: rgba(244, 244, 244, 0.88); color: #666666; }
.track-popover { position: absolute; z-index: 5; box-sizing: border-box; width: min(244px, calc(100% - 8px)); max-width: 244px; padding: 8px; border: 1px solid #2864c7; border-radius: 4px; background: #ffffff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); pointer-events: auto; font: 11px Arial; }
.track-popover label { display: block; margin: 4px 0; }
.track-popover select, .track-popover input { width: 100%; box-sizing: border-box; margin-top: 2px; }
.track-popover-actions { display: grid; grid-template-columns: 1fr; gap: 5px; margin-top: 8px; }
.track-popover-footer { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; margin-top: 5px; }
.track-popover-actions button, .track-popover-footer button { min-width: 0; white-space: normal; }
.track-popover-error { min-height: 12px; margin-top: 4px; color: #b00020; font-size: 10px; }
.grid-status { position: absolute; max-width: 230px; padding: 4px 6px; border-radius: 3px; background: rgba(255, 248, 225, 0.95); color: #6c5500; font: 10px Arial; }
.grid-child { position: absolute; z-index: 2; box-sizing: border-box; border: 1px solid transparent; background: transparent; pointer-events: auto; }
.grid-selection-target { position: absolute; z-index: 1; box-sizing: border-box; background: transparent; pointer-events: auto; }
.nested-grid-component { position: absolute; z-index: 3; box-sizing: border-box; background: transparent; pointer-events: auto; cursor: move; }
.nested-grid-handle { position: absolute; width: 8px; height: 8px; box-sizing: border-box; border: 1px solid #ffffff; background: #2864c7; pointer-events: auto; }
.grid-drop-band { position: absolute; z-index: 1; box-sizing: border-box; border: 1px dashed rgba(18, 77, 168, 0.7); background: rgba(18, 77, 168, 0.06); pointer-events: none; }
.grid-child.selected { border: 2px solid rgba(18, 77, 168, 0.85); }
.grid-child.selected.editable { pointer-events: auto; cursor: move; }
.grid-child.selected.editable.grid-placement { z-index: 3; pointer-events: none; }
.grid-move-edge { position: absolute; pointer-events: auto; cursor: move; }
.grid-move-edge.top, .grid-move-edge.bottom { left: 0; width: 100%; height: 6px; }
.grid-move-edge.top { top: -3px; }
.grid-move-edge.bottom { bottom: -3px; }
.grid-move-edge.left, .grid-move-edge.right { top: 0; height: 100%; width: 6px; }
.grid-move-edge.left { left: -3px; }
.grid-move-edge.right { right: -3px; }
.grid-span-handle { position: absolute; z-index: 3; width: 8px; height: 8px; box-sizing: border-box; border: 1px solid #ffffff; border-radius: 2px; background: #2864c7; pointer-events: auto; }
.grid-span-handle.top { left: 50%; top: -5px; margin-left: -4px; cursor: n-resize; }
.grid-span-handle.bottom { left: 50%; bottom: -5px; margin-left: -4px; cursor: s-resize; }
.grid-span-handle.left { left: -5px; top: 50%; margin-top: -4px; cursor: w-resize; }
.grid-span-handle.right { right: -5px; top: 50%; margin-top: -4px; cursor: e-resize; }
.grid-span-handle.top-left { left: -5px; top: -5px; cursor: nw-resize; }
.grid-span-handle.top-right { right: -5px; top: -5px; cursor: ne-resize; }
.grid-span-handle.bottom-left { left: -5px; bottom: -5px; cursor: sw-resize; }
.grid-span-handle.bottom-right { right: -5px; bottom: -5px; cursor: se-resize; }
.grid-child-draft { position: absolute; z-index: 3; box-sizing: border-box; border: 2px dashed #2864c7; background: transparent; pointer-events: none; }
.silhouette { fill: none; stroke: #2864c7; stroke-width: 1.25; stroke-dasharray: 4 3; pointer-events: all; cursor: move; }
.tab-group-frame { pointer-events: stroke; }
.tab-group-header { fill: rgba(0, 0, 0, 0.001); stroke: transparent; pointer-events: all; }
.selected { stroke: #124da8; stroke-width: 2; }
.handle { fill: #2864c7; stroke: #ffffff; stroke-width: 1; pointer-events: all; }
.root-handle { fill: #f2b84b; stroke: #654000; stroke-width: 1; pointer-events: all; }
.root-handle[data-handle="root-nw"] { cursor: nw-resize; }
.root-handle[data-handle="root-n"] { cursor: n-resize; }
.root-handle[data-handle="root-w"] { cursor: w-resize; }
.root-handle[data-handle="root-e"] { cursor: e-resize; }
.root-handle[data-handle="root-ne"] { cursor: ne-resize; }
.root-handle[data-handle="root-sw"] { cursor: sw-resize; }
.root-handle[data-handle="root-s"] { cursor: s-resize; }
.root-handle[data-handle="root-se"] { cursor: se-resize; }
.root-handle.locked { fill: #9a9a9a; cursor: not-allowed; }
.handle[data-handle="n"], .nested-grid-handle[data-handle="n"] { cursor: n-resize; }
.handle[data-handle="s"], .nested-grid-handle[data-handle="s"] { cursor: s-resize; }
.handle[data-handle="e"], .nested-grid-handle[data-handle="e"] { cursor: e-resize; }
.handle[data-handle="w"], .nested-grid-handle[data-handle="w"] { cursor: w-resize; }
.handle[data-handle="ne"], .nested-grid-handle[data-handle="ne"] { cursor: ne-resize; }
.handle[data-handle="nw"], .nested-grid-handle[data-handle="nw"] { cursor: nw-resize; }
.handle[data-handle="se"], .nested-grid-handle[data-handle="se"] { cursor: se-resize; }
.handle[data-handle="sw"], .nested-grid-handle[data-handle="sw"] { cursor: sw-resize; }
.handle[data-resize-constraint="fixedHeight"][data-handle="ne"],
.handle[data-resize-constraint="fixedHeight"][data-handle="nw"],
.handle[data-resize-constraint="fixedHeight"][data-handle="se"],
.handle[data-resize-constraint="fixedHeight"][data-handle="sw"],
.nested-grid-handle[data-resize-constraint="fixedHeight"][data-handle="ne"],
.nested-grid-handle[data-resize-constraint="fixedHeight"][data-handle="nw"],
.nested-grid-handle[data-resize-constraint="fixedHeight"][data-handle="se"],
.nested-grid-handle[data-resize-constraint="fixedHeight"][data-handle="sw"] { cursor: ew-resize; }
.handle[data-resize-constraint="fixedWidth"][data-handle="ne"],
.handle[data-resize-constraint="fixedWidth"][data-handle="nw"],
.handle[data-resize-constraint="fixedWidth"][data-handle="se"],
.handle[data-resize-constraint="fixedWidth"][data-handle="sw"],
.nested-grid-handle[data-resize-constraint="fixedWidth"][data-handle="ne"],
.nested-grid-handle[data-resize-constraint="fixedWidth"][data-handle="nw"],
.nested-grid-handle[data-resize-constraint="fixedWidth"][data-handle="se"],
.nested-grid-handle[data-resize-constraint="fixedWidth"][data-handle="sw"] { cursor: ns-resize; }
</style>
<script>
var component;
var svg;
var currentData = { width: 1, height: 1, components: [], gridSelectionTargets: [] };
var gridGesture = null;
var absoluteGesture = null;
var reparentGuide = null;
var outlineNodes = new Map();
var selectionLayer = null;
var rootLayer = null;
var outlineOrder = "";
var selectionKey = "";
var rootKey = "";
var tabControlsKey = "";
var gridControlsKey = "";
var trackControlsKey = "";
var gridChildHost = null;
var gridTrackHost = null;
var renderedGridEditor = null;
var renderedGridPlacement = null;
var renderedChildGridEditor = null;
var receivedRevision = -1;

function setup(htmlComponent) {
  component = htmlComponent;
  svg = document.getElementById("overlay");
  document.addEventListener("keydown", deleteSelectionKey);
  document.addEventListener("keydown", clipboardSelectionKey);
  document.addEventListener("keydown", editorShortcutKey);
  document.addEventListener("pointerdown", function(event) {
    if (previewTextTarget(event.target)) return;
    document.body.focus({preventScroll: true});
    // Right-click must never start a selection, move, or resize gesture.
    if (event.button === 2) event.stopPropagation();
  }, true);
  document.addEventListener("contextmenu", previewContextMenu);
  htmlComponent.addEventListener("DataChanged", function(event) {
    var incoming = htmlComponent.Data || currentData;
    var version = incoming.gridEditor && incoming.gridEditor.revision;
    if (Number.isFinite(version) && version < receivedRevision) return;
    if (Number.isFinite(version)) receivedRevision = version;
    var sameGeometry = Number.isFinite(incoming.geometryRevision) &&
        incoming.geometryRevision === currentData.geometryRevision;
    currentData = incoming;
    if (absoluteGesture && absoluteGesture.modelRevision !== currentData.reparentRevision) {
      absoluteGesture = null;
      clearReparentGuide();
    }
    if (gridGesture && gridGesture.modelRevision !== currentData.reparentRevision) cancelGridChildGesture();
    if (sameGeometry) {
      // Retained closures need the new command revision even when no regions are rebuilt.
      if (renderedGridEditor && currentData.gridEditor) renderedGridEditor.revision = currentData.gridEditor.revision;
      if (renderedChildGridEditor && currentData.gridEditor) renderedChildGridEditor.revision = currentData.gridEditor.revision;
      if (renderedGridPlacement && currentData.gridPlacement) renderedGridPlacement.revision = currentData.gridPlacement.revision;
      acknowledgeRender();
    } else render();
    if (absoluteGesture && absoluteGesture.pendingPoint && currentData.dragSource &&
        currentData.dragSource.id === absoluteGesture.id) finishAbsoluteDrop(absoluteGesture.pendingPoint);
  });
  document.addEventListener("keydown", function(event) {
    if (event.key === "Escape" && absoluteGesture) {
      absoluteGesture = null;
      clearReparentGuide();
      component.sendEventToMATLAB("Pointer", {phase: "pointercancel", x: 0, y: 0, componentId: "", handle: ""});
    }
  });
  svg.addEventListener("pointerdown", sendPointerEvent);
  svg.addEventListener("pointermove", sendPointerEvent);
  svg.addEventListener("pointerup", sendPointerEvent);
  svg.addEventListener("pointercancel", sendPointerEvent);
  var initialData = htmlComponent.Data || currentData;
  var initialRevision = initialData.gridEditor && initialData.gridEditor.revision;
  if (Number.isFinite(initialRevision)) receivedRevision = initialRevision;
  currentData = htmlComponent.Data || currentData;
  render();
}

function previewTextTarget(target) {
  return target && (target.isContentEditable ||
    /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName || "") ||
    (target.closest && target.closest(".track-popover")));
}

function previewContextMenu(event) {
  if (previewTextTarget(event.target) || gridGesture || absoluteGesture || !currentData.gridEditor) return;
  var hit = event.target.closest && event.target.closest("[data-component-id]");
  var id = hit ? hit.dataset.componentId : currentData.rootId;
  if (!id) return;
  var rect = svg.getBoundingClientRect();
  var point = {x: event.clientX - rect.left, y: rect.height - (event.clientY - rect.top)};
  event.preventDefault();
  event.stopPropagation();
  component.sendEventToMATLAB("ContextMenu", {componentId: id,
    revision: currentData.gridEditor.revision, x: point.x, y: point.y});
}

function editorShortcutKey(event) {
  if (event.altKey || event.shiftKey || event.repeat || gridGesture || absoluteGesture ||
      previewTextTarget(event.target) || !currentData.selectedComponentId || !currentData.gridEditor) return;
  var control = event.ctrlKey || event.metaKey;
  var key = String(event.key).toLowerCase();
  if (control && ["n", "o", "s"].indexOf(key) !== -1) {
    event.preventDefault();
    event.stopPropagation();
    component.sendEventToMATLAB("Accelerator", {key: key.toUpperCase(), revision: currentData.gridEditor.revision});
    return;
  }
  var action = control ? ({z: "Undo", r: "Redo"})[key] : ({f5: "Reload"})[key];
  if (!action) return;
  event.preventDefault();
  event.stopPropagation();
  component.sendEventToMATLAB("Shortcut", {action: action,
    componentId: currentData.selectedComponentId, revision: currentData.gridEditor.revision});
}

function clipboardSelectionKey(event) {
  if (!(event.ctrlKey || event.metaKey) || event.altKey || event.shiftKey || event.repeat ||
      gridGesture || absoluteGesture) return;
  var actions = {c: "Copy", x: "Cut", v: "Paste"};
  var action = actions[String(event.key).toLowerCase()];
  if (!action) return;
  if (previewTextTarget(event.target)) return;
  if (!currentData.selectedComponentId || !currentData.gridEditor) return;
  event.preventDefault();
  event.stopPropagation();
  component.sendEventToMATLAB("Clipboard", {
    action: action, componentId: currentData.selectedComponentId, revision: currentData.gridEditor.revision
  });
}

function deleteSelectionKey(event) {
  if (event.key !== "Delete" || event.ctrlKey || event.metaKey || event.altKey || event.repeat || gridGesture || absoluteGesture) return;
  if (previewTextTarget(event.target)) return;
  if (!currentData.selectedComponentId || !currentData.gridEditor) return;
  event.preventDefault();
  event.stopPropagation();
  component.sendEventToMATLAB("DeleteSelection", {
    componentId: currentData.selectedComponentId, revision: currentData.gridEditor.revision
  });
}

function clearReparentGuide() {
  if (reparentGuide && reparentGuide.parentNode) reparentGuide.remove();
  reparentGuide = null;
}

function dropCandidate(gesture, point) {
  var source = currentData.dragSource;
  if (!source || source.id !== gesture.id) return null;
  var targets = componentArray(currentData.reparentTargets).filter(function(target) {
    var b = target.bounds;
    return point.x >= b[0] && point.x <= b[0] + b[2] && point.y >= b[1] && point.y <= b[1] + b[3];
  }).sort(function(a, b) { return Number(b.depth) - Number(a.depth); });
  var target = targets[0];
  if (!target) return source.parentId === currentData.rootId ? null :
    {enabled: false, reason: "No destination at this point.", bounds: source.bounds, parentId: "", targetCell: [], targetPosition: []};
  if (target.id === source.parentId) return null;
  var result = {enabled: Boolean(target.enabled), reason: target.reason || "", parentId: target.id,
    bounds: target.bounds, targetCell: [], targetPosition: []};
  if (target.grid && target.grid.geometryAvailable) {
    var cell = gridCellAt(target.grid, point);
    if (!cell) { result.enabled = false; result.reason = "Drop inside a grid cell."; return result; }
    var span = {rowStart: cell.row, rowEnd: cell.row + Number(source.rowSpan) - 1,
      columnStart: cell.column, columnEnd: cell.column + Number(source.columnSpan) - 1};
    result.targetCell = [cell.row, cell.column];
    var bounds = gridSpanBounds(target.grid, span);
    if (!bounds) { result.enabled = false; result.reason = "The span exceeds the destination grid."; return result; }
    result.bounds = bounds;
    if (componentArray(target.grid.children).some(function(child) {
      return child.id !== source.id && child.rowStart <= span.rowEnd && child.rowEnd >= span.rowStart &&
        child.columnStart <= span.columnEnd && child.columnEnd >= span.columnStart;
    })) { result.enabled = false; result.reason = "The destination cells are occupied."; }
  } else if (target.grid && target.grid.geometryAvailable === false) {
    result.enabled = false;
  } else if (!source.fillsParent) {
    var x = point.x - (gesture.startPoint.x - source.bounds[0]);
    var y = point.y - (gesture.startPoint.y - source.bounds[1]);
    result.bounds = [x, y, source.bounds[2], source.bounds[3]];
    result.targetPosition = [x - target.origin[0], y - target.origin[1], source.bounds[2], source.bounds[3]];
  }
  if (result.enabled) result.reason = "Move to " + target.name;
  return result;
}

function showReparentGuide(candidate) {
  clearReparentGuide();
  if (!candidate) return;
  var bounds = candidate.bounds;
  var surface = currentData.surfaceBounds || [0, 0, currentData.width, currentData.height];
  reparentGuide = document.createElement("div");
  reparentGuide.style.cssText = "position:absolute;pointer-events:none;z-index:20;box-sizing:border-box;font:11px Arial;white-space:nowrap;";
  reparentGuide.style.border = "2px dashed " + (candidate.enabled ? "#238636" : "#c22");
  reparentGuide.style.color = candidate.enabled ? "#154b2b" : "#a11";
  reparentGuide.style.background = candidate.enabled ? "rgba(35,134,54,0.10)" : "rgba(204,34,34,0.08)";
  reparentGuide.style.left = (bounds[0] - surface[0]) + "px";
  reparentGuide.style.top = (surface[1] + surface[3] - bounds[1] - bounds[3]) + "px";
  reparentGuide.style.width = Math.max(2, bounds[2]) + "px";
  reparentGuide.style.height = Math.max(2, bounds[3]) + "px";
  reparentGuide.textContent = candidate.reason;
  document.body.appendChild(reparentGuide);
}

function sendReparent(id, candidate, modelRevision) {
  clearReparentGuide();
  component.sendEventToMATLAB("Reparent", {componentId: id,
    parentId: candidate.enabled ? candidate.parentId : "", revision: currentData.gridEditor.revision,
    modelRevision: modelRevision,
    targetCell: candidate.targetCell, targetPosition: candidate.targetPosition});
}

function finishAbsoluteDrop(point) {
  var gesture = absoluteGesture;
  absoluteGesture = null;
  var candidate = dropCandidate(gesture, point);
  clearReparentGuide();
  if (candidate) sendReparent(gesture.id, candidate, gesture.modelRevision);
  else component.sendEventToMATLAB("Pointer", {phase: "pointerup", x: point.x, y: point.y, componentId: "", handle: ""});
}

function sendPointerEvent(event) {
  var rect = svg.getBoundingClientRect();
  var target = event.target;
  if (target.classList && target.classList.contains("locked")) return;
  var point = surfacePoint(event, rect);
  if (event.type === "pointerdown") {
    svg.setPointerCapture(event.pointerId);
    if (target.dataset.componentId && !target.dataset.handle && target.dataset.componentId !== currentData.rootId)
      absoluteGesture = {id: target.dataset.componentId, startPoint: point, modelRevision: currentData.reparentRevision};
  }
  if (event.type === "pointercancel") { absoluteGesture = null; clearReparentGuide(); }
  if (event.type === "pointermove" && absoluteGesture) showReparentGuide(dropCandidate(absoluteGesture, point));
  if (event.type === "pointerup" && absoluteGesture) {
    if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
    var distance = Math.hypot(point.x - absoluteGesture.startPoint.x, point.y - absoluteGesture.startPoint.y);
    if (distance < 3) {
      absoluteGesture = null;
      clearReparentGuide();
      component.sendEventToMATLAB("Pointer", {phase: "pointerup", x: point.x, y: point.y, componentId: "", handle: ""});
    } else if (!currentData.dragSource || currentData.dragSource.id !== absoluteGesture.id) absoluteGesture.pendingPoint = point;
    else finishAbsoluteDrop(point);
    return;
  }
  if (event.type === "pointerup" || event.type === "pointercancel") {
    if (svg.hasPointerCapture(event.pointerId)) {
      svg.releasePointerCapture(event.pointerId);
    }
  }
  component.sendEventToMATLAB("Pointer", {
    phase: event.type,
    x: point.x,
    y: point.y,
    componentId: target.dataset.componentId || "",
    handle: target.dataset.handle || "",
    tabIndex: 0
  });
}

function renderTabControls(components) {
  var controls = document.getElementById("tab-controls");
  controls.innerHTML = "";
  components.forEach(function(item) {
    if (!item.tabGroup || !item.tabTitles || item.tabTitles.length === 0) return;
    var selector = document.createElement("select");
    selector.className = "tab-selector";
    var controlWidth = Math.min(110, item.width);
    selector.style.left = (item.x + item.width - controlWidth) + "px";
    selector.style.top = (currentData.height - item.y - item.height + 3) + "px";
    selector.style.width = controlWidth + "px";
    selector.dataset.componentId = item.id;
    item.tabTitles.forEach(function(title, index) {
      var option = document.createElement("option");
      option.value = String(index + 1);
      option.textContent = String(title);
      selector.appendChild(option);
    });
    selector.value = String(item.tabSelected || 1);
    selector.addEventListener("change", function() {
      component.sendEventToMATLAB("Pointer", {
        phase: "tabselect", componentId: item.id,
        tabIndex: Number(selector.value), x: 0, y: 0, handle: ""
      });
    });
    controls.appendChild(selector);
  });
}

function renderGridSelectionTargets(targets, gridData, placementData) {
  var controls = gridChildHost || document.getElementById("grid-controls");
  componentArray(targets).sort(function(first, second) {
    return Number(first.depth || 0) - Number(second.depth || 0);
  }).forEach(function(target) {
    if (!target || !target.id || !target.gridId ||
        (gridData && String(gridData.activeGridId || "") === String(target.gridId))) return;
    if (!Number.isFinite(Number(target.x)) || !Number.isFinite(Number(target.y)) ||
        Number(target.width) <= 0 || Number(target.height) <= 0) return;
    var hitTarget = document.createElement("div");
    hitTarget.className = "grid-selection-target";
    hitTarget.dataset.componentId = target.id;
    hitTarget.style.left = Number(target.x) + "px";
    hitTarget.style.top = (currentData.height - Number(target.y) - Number(target.height)) + "px";
    hitTarget.style.width = Number(target.width) + "px";
    hitTarget.style.height = Number(target.height) + "px";
    var placementChild = placementData && placementData.editable && placementData.geometryAvailable &&
      String(placementData.activeGridId) === String(target.gridId) &&
      componentArray(placementData.children).find(function(child) {
        return child.selected && child.editable && String(child.id) === String(target.id);
      });
    hitTarget.title = placementChild ? "Move selected grid" : "Select grid child";
    if (placementChild) hitTarget.style.cursor = "move";
    hitTarget.addEventListener("pointerdown", function(event) {
      if (placementChild) {
        beginGridChildGesture(event, placementData, placementChild, "move");
        return;
      }
      event.preventDefault();
      event.stopPropagation();
      component.sendEventToMATLAB("GridAction", {
        action: "select-child", revision: Number(gridData ? gridData.revision : currentData.revision),
        activeGridId: target.gridId, childId: target.id
      });
    });
    controls.appendChild(hitTarget);
  });
}

function renderNestedGridComponents(components) {
  var controls = gridChildHost || document.getElementById("grid-controls");
  componentArray(components).filter(function(item) { return !!item.inGrid; }).forEach(function(item) {
    var x = Number(item.x);
    var y = Number(item.y);
    var width = Number(item.width);
    var height = Number(item.height);
    if (!Number.isFinite(x) || !Number.isFinite(y) || width <= 0 || height <= 0) return;
    var target = document.createElement("div");
    target.className = "nested-grid-component";
    target.dataset.componentId = item.id;
    target.style.left = x + "px";
    target.style.top = (currentData.height - y - height) + "px";
    target.style.width = width + "px";
    target.style.height = height + "px";
    target.addEventListener("pointerdown", sendPointerEvent);
    if (item.selected) {
      var positions = { sw: [0, height], s: [width / 2, height], se: [width, height],
        w: [0, height / 2], e: [width, height / 2], nw: [0, 0],
        n: [width / 2, 0], ne: [width, 0] };
      Object.keys(positions).forEach(function(kind) {
        if (item.resizeConstraint === "fixedHeight" && (kind === "n" || kind === "s")) return;
        if (item.resizeConstraint === "fixedWidth" && (kind === "e" || kind === "w")) return;
        var handle = document.createElement("div");
        handle.className = "nested-grid-handle";
        handle.dataset.componentId = item.id;
        handle.dataset.handle = kind;
        handle.dataset.resizeConstraint = item.resizeConstraint || "";
        handle.style.left = (positions[kind][0] - 4) + "px";
        handle.style.top = (positions[kind][1] - 4) + "px";
        target.appendChild(handle);
      });
    }
    controls.appendChild(target);
  });
}

function renderGridPlacement(data) {
  if (!data || !data.editable || !data.geometryAvailable) return;
  var child = componentArray(data.children).find(function(item) { return item.selected && item.editable; });
  if (!child || !child.bounds || child.bounds.length !== 4 || child.bounds[2] <= 0 || child.bounds[3] <= 0) return;
  // Keep inner components and track controls clickable while exposing parent placement at the frame.
  var frame = document.createElement("div");
  frame.className = "grid-child selected editable grid-placement";
  frame.dataset.componentId = child.id;
  frame.style.left = child.bounds[0] + "px";
  frame.style.top = (currentData.height - child.bounds[1] - child.bounds[3]) + "px";
  frame.style.width = child.bounds[2] + "px";
  frame.style.height = child.bounds[3] + "px";
  ["top", "bottom", "left", "right"].forEach(function(kind) {
    var edge = document.createElement("div");
    edge.className = "grid-move-edge " + kind;
    edge.title = "Move selected grid";
    edge.addEventListener("pointerdown", function(event) {
      beginGridChildGesture(event, data, child, "move");
    });
    frame.appendChild(edge);
  });
  ["top", "bottom", "left", "right", "top-left", "top-right", "bottom-left", "bottom-right"].forEach(function(kind) {
    var handle = document.createElement("div");
    handle.className = "grid-span-handle " + kind;
    handle.title = "Resize grid span";
    handle.addEventListener("pointerdown", function(event) {
      beginGridChildGesture(event, data, child, kind);
    });
    frame.appendChild(handle);
  });
  (gridChildHost || document.getElementById("grid-controls")).appendChild(frame);
}

function renderGridEditor(data, headersOnly) {
  var controls = gridTrackHost || document.getElementById("grid-controls");
  if (!data || !data.activeGridId || !data.outerBounds || data.outerBounds.length !== 4) return;
  var outer = data.outerBounds;
  var inner = data.innerBounds;
  if (outer[2] <= 0 || outer[3] <= 0 || inner[2] <= 0 || inner[3] <= 0) return;
  function addBox(className, bounds) {
    var box = document.createElement("div");
    box.className = className;
    box.style.left = bounds[0] + "px";
    box.style.top = (currentData.height - bounds[1] - bounds[3]) + "px";
    box.style.width = bounds[2] + "px";
    box.style.height = bounds[3] + "px";
    controls.appendChild(box);
  }
  addBox("grid-frame", outer);
  function addSeparator(className, left, top, width, height) {
    var separator = document.createElement("div");
    separator.className = "grid-separator " + className;
    separator.style.left = left + "px";
    separator.style.top = top + "px";
    separator.style.width = width + "px";
    separator.style.height = height + "px";
    controls.appendChild(separator);
  }
  function addTrackDividers(axis, tracks) {
    var list = componentArray(tracks);
    for (var index = 0; index + 1 < list.length; index += 1) {
      var first = list[index];
      var second = list[index + 1];
      if (!first.bounds || !second.bounds || first.bounds.length !== 4 || second.bounds.length !== 4) continue;
      if (axis === "row") {
        var upperBottom = Number(first.bounds[1]);
        var lowerTop = Number(second.bounds[1]) + Number(second.bounds[3]);
        if (!Number.isFinite(upperBottom) || !Number.isFinite(lowerTop)) continue;
        addSeparator("horizontal", inner[0], currentData.height - (upperBottom + lowerTop) / 2, inner[2], 0);
      } else {
        var leftEdge = Number(first.bounds[0]) + Number(first.bounds[2]);
        var rightEdge = Number(second.bounds[0]);
        if (!Number.isFinite(leftEdge) || !Number.isFinite(rightEdge)) continue;
        addSeparator("vertical", (leftEdge + rightEdge) / 2, currentData.height - inner[1] - inner[3], 0, inner[3]);
      }
    }
  }
  addTrackDividers("row", data.rowTracks);
  addTrackDividers("column", data.columnTracks);
  function collapsedBand(axis, track, tracks) {
    var extent = axis === "row" ? Number(track.bounds[3]) : Number(track.bounds[2]);
    var anchor = axis === "row" ? Number(track.bounds[1]) : Number(track.bounds[0]);
    if (extent > 0.5) return null;
    var matching = componentArray(tracks).filter(function(candidate) {
      var candidateExtent = axis === "row" ? Number(candidate.bounds[3]) : Number(candidate.bounds[2]);
      var candidateAnchor = axis === "row" ? Number(candidate.bounds[1]) : Number(candidate.bounds[0]);
      return candidateExtent <= 0.5 && Math.abs(candidateAnchor - anchor) <= 0.5;
    });
    var order = matching.findIndex(function(candidate) { return Number(candidate.index) === Number(track.index); });
    var size = 8;
    var center = anchor + (order - (matching.length - 1) / 2) * size;
    return { start: center - size / 2, end: center + size / 2 };
  }
  function addHeader(axis, track) {
    var hasBounds = !!track.bounds && track.bounds.length === 4 &&
      Number.isFinite(Number(track.bounds[0])) && Number.isFinite(Number(track.bounds[1])) &&
      Number(track.bounds[2]) >= 0 && Number(track.bounds[3]) >= 0;
    if (!hasBounds) return;
    var header = document.createElement("button");
    header.type = "button";
    var editable = !!track.editable && !!data.editable;
    header.className = "track-settings" + (editable ? "" : " locked");
    header.dataset.gridId = data.activeGridId;
    header.dataset.componentId = data.activeGridId;
    header.dataset.axis = axis;
    header.dataset.index = String(track.index);
    var trackName = (axis === "row" ? "row " : "column ") + String(track.index);
    header.title = editable ? "Edit " + trackName : String(data.readOnlyReason || "Track editing is unavailable.");
    header.setAttribute("aria-label", editable ? "Edit " + trackName : "Track editing is unavailable.");
    header.textContent = "\u2699";
    if (editable) {
      header.addEventListener("pointerdown", function(event) { event.stopPropagation(); });
      header.addEventListener("click", function(event) {
        event.stopPropagation();
        openTrackPopover(header, data, axis, track);
      });
    }
    var buttonSize = 12;
    var railGap = 0;
    var leftRail = Number(outer[0]) - railGap - buttonSize;
    var rightRail = Number(outer[0]) + Number(outer[2]) + railGap;
    var topRail = currentData.height - Number(outer[1]) - Number(outer[3]) - railGap - buttonSize;
    var bottomRail = currentData.height - Number(outer[1]) + railGap;
    var surface = currentData.surfaceBounds || [0, 0, currentData.width, currentData.height];
    var surfaceLeft = Number(surface[0]);
    var surfaceRight = surfaceLeft + Number(surface[2]);
    var surfaceTop = currentData.height - Number(surface[1]) - Number(surface[3]);
    var surfaceBottom = currentData.height - Number(surface[1]);
    var rowRail = leftRail >= surfaceLeft ? leftRail :
      (rightRail + buttonSize <= surfaceRight ? rightRail : null);
    var columnRail = topRail >= surfaceTop ? topRail :
      (bottomRail + buttonSize <= surfaceBottom ? bottomRail : null);
    if (axis === "row" && rowRail === null) return;
    if (axis === "column" && columnRail === null) return;
    if (axis === "row") {
      var rowBand = collapsedBand(axis, track, data.rowTracks);
      var rowCenter = rowBand ? (rowBand.start + rowBand.end) / 2 :
        Number(track.bounds[1]) + Number(track.bounds[3]) / 2;
      header.style.left = rowRail + "px";
      header.style.top = Math.max(surfaceTop, Math.min(surfaceBottom - buttonSize,
        currentData.height - rowCenter - buttonSize / 2)) + "px";
    } else {
      var columnBand = collapsedBand(axis, track, data.columnTracks);
      var columnCenter = columnBand ? (columnBand.start + columnBand.end) / 2 :
        Number(track.bounds[0]) + Number(track.bounds[2]) / 2;
      header.style.left = Math.max(surfaceLeft, Math.min(surfaceRight - buttonSize,
        columnCenter - buttonSize / 2)) + "px";
      header.style.top = columnRail + "px";
    }
    controls.appendChild(header);
  }
  componentArray(data.rowTracks).forEach(function(track) { addHeader("row", track); });
  componentArray(data.columnTracks).forEach(function(track) { addHeader("column", track); });
  if (!headersOnly) renderGridChildren(data);
  if (data.readOnlyReason) {
    var status = document.createElement("div");
    status.className = "grid-status";
    status.style.left = Math.max(0, outer[0]) + "px";
    status.style.top = Math.min(currentData.height - 24, currentData.height - outer[1] + 4) + "px";
    status.textContent = String(data.readOnlyReason);
    controls.appendChild(status);
  }
}

function renderGridChildren(data) {
  if (!data || !data.activeGridId || !data.outerBounds || !data.innerBounds) return;
  if (data.outerBounds[2] <= 0 || data.outerBounds[3] <= 0 ||
      data.innerBounds[2] <= 0 || data.innerBounds[3] <= 0) return;
  var controls = gridChildHost || document.getElementById("grid-controls");
  componentArray(data.children).forEach(function(child) {
    if (!child.bounds || child.bounds.length !== 4 || child.bounds[2] <= 0 || child.bounds[3] <= 0) return;
    var childBox = document.createElement("div");
    childBox.dataset.componentId = child.id;
    var childEditable = !!child.selected && !!child.editable && !!data.editable && !!data.geometryAvailable;
    childBox.className = "grid-child" + (child.selected ? " selected" : "") +
      (childEditable ? " editable" : "");
    childBox.style.left = child.bounds[0] + "px";
    childBox.style.top = (currentData.height - child.bounds[1] - child.bounds[3]) + "px";
    childBox.style.width = child.bounds[2] + "px";
    childBox.style.height = child.bounds[3] + "px";
    childBox.title = String(child.placementMode || "implicit") + " R" +
      String(child.rowStart || "?") + " C" + String(child.columnStart || "?");
    childBox.addEventListener("pointerdown", function(event) {
      if (!child.selected) {
        selectGridChild(event, data, child);
      } else if (childEditable) {
        beginGridChildGesture(event, data, child, "move");
      }
    });
    if (childEditable) {
      ["top", "bottom", "left", "right", "top-left", "top-right", "bottom-left", "bottom-right"].forEach(function(kind) {
        var handle = document.createElement("div");
        handle.className = "grid-span-handle " + kind;
        handle.title = "Resize grid span";
        handle.addEventListener("pointerdown", function(event) {
          beginGridChildGesture(event, data, child, kind);
        });
        childBox.appendChild(handle);
      });
    }
    controls.appendChild(childBox);
  });
}

function gridPoint(event) {
  var rect = document.getElementById("overlay").getBoundingClientRect();
  return surfacePoint(event, rect);
}

function surfacePoint(event, rect) {
  var bounds = currentData.surfaceBounds || [0, 0, currentData.width, currentData.height];
  return { x: Number(bounds[0]) + event.clientX - rect.left,
    y: Number(bounds[1]) + rect.height - (event.clientY - rect.top) };
}

function collapsedTrackBand(axis, track, tracks) {
  var bounds = track.bounds || [];
  var extent = axis === "row" ? Number(bounds[3]) : Number(bounds[2]);
  var anchor = axis === "row" ? Number(bounds[1]) : Number(bounds[0]);
  if (bounds.length !== 4 || extent > 0.5 || !Number.isFinite(anchor)) return null;
  var matching = componentArray(tracks).filter(function(candidate) {
    var candidateBounds = candidate.bounds || [];
    var candidateExtent = axis === "row" ? Number(candidateBounds[3]) : Number(candidateBounds[2]);
    var candidateAnchor = axis === "row" ? Number(candidateBounds[1]) : Number(candidateBounds[0]);
    return candidateBounds.length === 4 && candidateExtent <= 0.5 &&
      Math.abs(candidateAnchor - anchor) <= 0.5;
  });
  var order = matching.findIndex(function(candidate) { return Number(candidate.index) === Number(track.index); });
  var size = 8;
  var center = anchor + (order - (matching.length - 1) / 2) * size;
  return { start: center - size / 2, end: center + size / 2 };
}

function axisTrackAt(tracks, value, axis) {
  var collapsed = componentArray(tracks).find(function(track) {
    var band = collapsedTrackBand(axis, track, tracks);
    return band && value >= band.start && value <= band.end;
  });
  if (collapsed) return Number(collapsed.index);
  var positive = componentArray(tracks).find(function(track) {
    var bounds = track.bounds || [];
    var start = axis === "row" ? Number(bounds[1]) : Number(bounds[0]);
    var extent = axis === "row" ? Number(bounds[3]) : Number(bounds[2]);
    return bounds.length === 4 && extent > 0.5 && value >= start && value <= start + extent;
  });
  return positive ? Number(positive.index) : 0;
}

function gridCellAt(data, point) {
  var row = axisTrackAt(data.rowTracks, point.y, "row");
  var column = axisTrackAt(data.columnTracks, point.x, "column");
  return row > 0 && column > 0 ? { row: row, column: column } : null;
}

function showCollapsedDropBands(data) {
  var controls = document.getElementById("grid-controls");
  componentArray(data.rowTracks).forEach(function(track) {
    var band = collapsedTrackBand("row", track, data.rowTracks);
    if (!band) return;
    var element = document.createElement("div");
    element.className = "grid-drop-band";
    element.style.left = Number(data.innerBounds[0]) + "px";
    element.style.top = (currentData.height - band.end) + "px";
    element.style.width = Number(data.innerBounds[2]) + "px";
    element.style.height = (band.end - band.start) + "px";
    element.title = "Drop in row " + String(track.index);
    controls.appendChild(element);
  });
  componentArray(data.columnTracks).forEach(function(track) {
    var band = collapsedTrackBand("column", track, data.columnTracks);
    if (!band) return;
    var element = document.createElement("div");
    element.className = "grid-drop-band";
    element.style.left = band.start + "px";
    element.style.top = (currentData.height - Number(data.innerBounds[1]) - Number(data.innerBounds[3])) + "px";
    element.style.width = (band.end - band.start) + "px";
    element.style.height = Number(data.innerBounds[3]) + "px";
    element.title = "Drop in column " + String(track.index);
    controls.appendChild(element);
  });
}

function gridSpanBounds(data, candidate) {
  var rows = componentArray(data.rowTracks);
  var columns = componentArray(data.columnTracks);
  var firstRow = rows[candidate.rowStart - 1];
  var lastRow = rows[candidate.rowEnd - 1];
  var firstColumn = columns[candidate.columnStart - 1];
  var lastColumn = columns[candidate.columnEnd - 1];
  if (!firstRow || !lastRow || !firstColumn || !lastColumn) return null;
  var left = firstColumn.bounds[0];
  var right = lastColumn.bounds[0] + lastColumn.bounds[2];
  var bottom = lastRow.bounds[1];
  var top = firstRow.bounds[1] + firstRow.bounds[3];
  return [left, bottom, right - left, top - bottom];
}

function sameGridSpan(first, second) {
  return first.rowStart === second.rowStart && first.rowEnd === second.rowEnd &&
    first.columnStart === second.columnStart && first.columnEnd === second.columnEnd;
}

function nearestResizeTrack(tracks, initial, delta, axis, endEdge, minimum, maximum) {
  var list = componentArray(tracks);
  function edge(track) {
    var bounds = track.bounds;
    return axis === "row" ? Number(bounds[1]) + (endEdge ? 0 : Number(bounds[3])) :
      Number(bounds[0]) + (endEdge ? Number(bounds[2]) : 0);
  }
  var position = edge(list[initial - 1]) + delta;
  var best = initial;
  var distance = Math.abs(delta);
  for (var index = minimum; index <= maximum; index += 1) {
    var nextDistance = Math.abs(edge(list[index - 1]) - position);
    if (nextDistance < distance) {
      best = index;
      distance = nextDistance;
    }
  }
  return best;
}

function candidateGridSpan(gesture, point) {
  var candidate = {
    rowStart: Number(gesture.child.rowStart), rowEnd: Number(gesture.child.rowEnd),
    columnStart: Number(gesture.child.columnStart), columnEnd: Number(gesture.child.columnEnd)
  };
  if (gesture.kind === "move") {
    var target = gridCellAt(gesture.data, point);
    if (!target) return null;
    candidate.rowStart += target.row - gesture.startCell.row;
    candidate.rowEnd += target.row - gesture.startCell.row;
    candidate.columnStart += target.column - gesture.startCell.column;
    candidate.columnEnd += target.column - gesture.startCell.column;
  } else {
    var dx = point.x - gesture.startPoint.x;
    var dy = point.y - gesture.startPoint.y;
    if (gesture.kind.indexOf("top") >= 0) candidate.rowStart = nearestResizeTrack(
      gesture.data.rowTracks, candidate.rowStart, dy, "row", false, 1, candidate.rowEnd);
    if (gesture.kind.indexOf("bottom") >= 0) candidate.rowEnd = nearestResizeTrack(
      gesture.data.rowTracks, candidate.rowEnd, dy, "row", true, candidate.rowStart,
      componentArray(gesture.data.rowTracks).length);
    if (gesture.kind.indexOf("left") >= 0) candidate.columnStart = nearestResizeTrack(
      gesture.data.columnTracks, candidate.columnStart, dx, "column", false, 1, candidate.columnEnd);
    if (gesture.kind.indexOf("right") >= 0) candidate.columnEnd = nearestResizeTrack(
      gesture.data.columnTracks, candidate.columnEnd, dx, "column", true, candidate.columnStart,
      componentArray(gesture.data.columnTracks).length);
  }
  if (candidate.rowStart < 1 || candidate.columnStart < 1 ||
      candidate.rowEnd < candidate.rowStart || candidate.columnEnd < candidate.columnStart ||
      candidate.rowEnd > componentArray(gesture.data.rowTracks).length ||
      candidate.columnEnd > componentArray(gesture.data.columnTracks).length) return null;
  return candidate;
}

function updateGridChildDraft() {
  if (!gridGesture || !gridGesture.candidate) return;
  var bounds = gridSpanBounds(gridGesture.data, gridGesture.candidate);
  if (!bounds) return;
  var draft = gridGesture.draft;
  var width = Math.max(2, bounds[2]);
  var height = Math.max(2, bounds[3]);
  draft.style.left = (bounds[0] - (width - bounds[2]) / 2) + "px";
  draft.style.top = (currentData.height - bounds[1] - bounds[3] - (height - bounds[3]) / 2) + "px";
  draft.style.width = width + "px";
  draft.style.height = height + "px";
}

function finishGridChildGesture(commit) {
  if (!gridGesture) return;
  var gesture = gridGesture;
  gridGesture = null;
  document.removeEventListener("pointermove", moveGridChildGesture);
  document.removeEventListener("pointerup", finishGridChildPointer);
  document.removeEventListener("pointercancel", cancelGridChildGesture);
  document.removeEventListener("keydown", cancelGridChildKey);
  if (gesture.draft.parentNode) gesture.draft.remove();
  document.querySelectorAll(".grid-drop-band").forEach(function(element) { element.remove(); });
  clearReparentGuide();
  if (commit && gesture.reparent) { sendReparent(gesture.child.id, gesture.reparent, gesture.modelRevision); return; }
  if (!commit || !gesture.candidate || sameGridSpan(gesture.child, gesture.candidate)) return;
  component.sendEventToMATLAB("GridAction", {
    action: gesture.kind === "move" ? "move-child" : "resize-span",
    revision: gesture.data.revision, activeGridId: gesture.data.activeGridId,
    childId: gesture.child.id, rowStart: gesture.candidate.rowStart,
    rowEnd: gesture.candidate.rowEnd, columnStart: gesture.candidate.columnStart,
    columnEnd: gesture.candidate.columnEnd
  });
}

function moveGridChildGesture(event) {
  if (!gridGesture) return;
  if (gridGesture.kind === "move") {
    gridGesture.reparent = dropCandidate({id: gridGesture.child.id, startPoint: gridGesture.startPoint}, gridPoint(event));
    showReparentGuide(gridGesture.reparent);
    if (gridGesture.reparent) return;
  }
  var candidate = candidateGridSpan(gridGesture, gridPoint(event));
  if (!candidate) { gridGesture.candidate = null; return; }
  gridGesture.candidate = candidate;
  updateGridChildDraft();
}

function finishGridChildPointer(event) {
  if (gridGesture) {
    moveGridChildGesture(event);
    finishGridChildGesture(true);
  }
}

function cancelGridChildGesture() { finishGridChildGesture(false); }

function cancelGridChildKey(event) {
  if (event.key === "Escape") {
    event.preventDefault();
    finishGridChildGesture(false);
  }
}

function nearestChildTrack(tracks, value, axis, start, end) {
  var best = null;
  var distance = Infinity;
  componentArray(tracks).forEach(function(track) {
    var index = Number(track.index);
    if (index < Number(start) || index > Number(end)) return;
    var lower = Number(track.bounds[axis === "row" ? 1 : 0]);
    var upper = lower + Number(track.bounds[axis === "row" ? 3 : 2]);
    var nextDistance = Math.max(lower - value, value - upper, 0);
    if (nextDistance < distance) { best = index; distance = nextDistance; }
  });
  return best;
}

function beginGridChildGesture(event, data, child, kind) {
  event.preventDefault();
  event.stopPropagation();
  if (gridGesture || !data.geometryAvailable || !child.editable || !data.editable) return;
  var startPoint = gridPoint(event);
  var startCell = null;
  // Frame edges can straddle spacing or sit just outside the parent's cell.
  if (kind === "move") {
    var row = nearestChildTrack(data.rowTracks, startPoint.y, "row", child.rowStart, child.rowEnd);
    var column = nearestChildTrack(data.columnTracks, startPoint.x, "column", child.columnStart, child.columnEnd);
    if (row !== null && column !== null) startCell = { row: row, column: column };
  }
  if (kind === "move" && !startCell) return;
  var draft = document.createElement("div");
  draft.className = "grid-child-draft";
  document.getElementById("grid-controls").appendChild(draft);
  gridGesture = { data: data, child: child, kind: kind, startCell: startCell,
    modelRevision: currentData.reparentRevision,
    startPoint: startPoint, draft: draft,
    candidate: { rowStart: Number(child.rowStart), rowEnd: Number(child.rowEnd),
      columnStart: Number(child.columnStart), columnEnd: Number(child.columnEnd) } };
  showCollapsedDropBands(data);
  updateGridChildDraft();
  document.addEventListener("pointermove", moveGridChildGesture);
  document.addEventListener("pointerup", finishGridChildPointer);
  document.addEventListener("pointercancel", cancelGridChildGesture);
  document.addEventListener("keydown", cancelGridChildKey);
}

function selectGridChild(event, data, child) {
  event.preventDefault();
  event.stopPropagation();
  component.sendEventToMATLAB("GridAction", {
    action: "select-child", revision: data.revision, activeGridId: data.activeGridId,
    childId: child.id
  });
}

function closeTrackPopover() {
  var popover = document.getElementById("track-popover");
  if (popover) popover.remove();
}

function openTrackPopover(header, data, axis, track) {
  closeTrackPopover();
  var popover = document.createElement("div");
  popover.id = "track-popover";
  popover.className = "track-popover";
  var title = document.createElement("div");
  title.textContent = (axis === "row" ? "Row " : "Column ") + String(track.index);
  var modeLabel = document.createElement("label");
  modeLabel.textContent = "Mode";
  var mode = document.createElement("select");
  ["fit", "fixed", "flexible"].forEach(function(kind) {
    var option = document.createElement("option");
    option.value = kind;
    option.textContent = kind === "fit" ? "Fit" : (kind === "fixed" ? "Fixed px" : "Flexible x");
    option.selected = kind === track.kind;
    mode.appendChild(option);
  });
  modeLabel.appendChild(mode);
  var valueLabel = document.createElement("label");
  valueLabel.textContent = "Value";
  var value = document.createElement("input");
  value.type = "number";
  value.min = "0";
  value.step = "any";
  value.value = String(track.value || 0);
  value.disabled = mode.value === "fit";
  valueLabel.appendChild(value);
  var error = document.createElement("div");
  error.className = "track-popover-error";
  var actions = document.createElement("div");
  actions.className = "track-popover-actions";
  var insertBefore = document.createElement("button");
  insertBefore.type = "button";
  insertBefore.textContent = axis === "row" ? "Insert Row Above" : "Insert Column Left";
  var insertAfter = document.createElement("button");
  insertAfter.type = "button";
  insertAfter.textContent = axis === "row" ? "Insert Row Below" : "Insert Column Right";
  var remove = document.createElement("button");
  remove.type = "button";
  remove.textContent = axis === "row" ? "Delete Row" : "Delete Column";
  var cancel = document.createElement("button");
  cancel.type = "button";
  cancel.textContent = "Cancel";
  var apply = document.createElement("button");
  apply.type = "button";
  apply.textContent = "Apply";
  actions.appendChild(insertBefore);
  actions.appendChild(insertAfter);
  actions.appendChild(remove);
  var footer = document.createElement("div");
  footer.className = "track-popover-footer";
  footer.appendChild(cancel);
  footer.appendChild(apply);
  popover.appendChild(title);
  popover.appendChild(modeLabel);
  popover.appendChild(valueLabel);
  popover.appendChild(error);
  popover.appendChild(actions);
  popover.appendChild(footer);
  popover.addEventListener("pointerdown", function(event) { event.stopPropagation(); });
  mode.addEventListener("change", function() { value.disabled = mode.value === "fit"; });
  cancel.addEventListener("click", closeTrackPopover);
  function structural(action, targetIndex) {
    component.sendEventToMATLAB("GridAction", {
      action: action, revision: data.revision, activeGridId: data.activeGridId,
      axis: axis, index: targetIndex, fromIndex: Number(track.index), mode: "fit", value: 0
    });
    closeTrackPopover();
  }
  insertBefore.addEventListener("click", function() { structural("insert-track", Number(track.index)); });
  insertAfter.addEventListener("click", function() { structural("insert-track", Number(track.index) + 1); });
  remove.addEventListener("click", function() { structural("delete-track", Number(track.index)); });
  function submit() {
    var amount = Number(value.value);
    if (mode.value !== "fit" && (!Number.isFinite(amount) || amount < 0)) {
      error.textContent = "Enter a finite nonnegative number.";
      return;
    }
    component.sendEventToMATLAB("GridAction", {
      action: "set-track", revision: data.revision, activeGridId: data.activeGridId,
      axis: axis, index: Number(track.index), mode: mode.value,
      value: mode.value === "fit" ? 0 : amount
    });
    closeTrackPopover();
  }
  apply.addEventListener("click", submit);
  popover.addEventListener("keydown", function(event) {
    if (event.key === "Escape") { event.preventDefault(); closeTrackPopover(); }
    if (event.key === "Enter") { event.preventDefault(); submit(); }
  });
  document.getElementById("grid-controls").appendChild(popover);
  placeTrackPopover(header, popover);
  if (!value.disabled) value.focus();
}

function placeTrackPopover(header, popover) {
  var controls = document.getElementById("grid-controls");
  var margin = 4;
  var width = popover.offsetWidth;
  var height = popover.offsetHeight;
  var surface = currentData.surfaceBounds || [0, 0, controls.clientWidth, controls.clientHeight];
  var minLeft = Number(surface[0]) + margin;
  var minTop = currentData.height - Number(surface[1]) - Number(surface[3]) + margin;
  var right = Number(surface[0]) + Number(surface[2]);
  var bottom = currentData.height - Number(surface[1]);
  var maxLeft = Math.max(minLeft, right - width - margin);
  var maxTop = Math.max(minTop, bottom - height - margin);
  var left = Math.max(minLeft, Math.min(maxLeft, header.offsetLeft));
  var below = header.offsetTop + header.offsetHeight + margin;
  var above = header.offsetTop - height - margin;
  var top = below + height <= bottom - margin ? below : above;
  top = Math.max(minTop, Math.min(maxTop, top));
  popover.style.left = left + "px";
  popover.style.top = top + "px";
}

function svgElement(name, attributes) {
  var element = document.createElementNS("http://www.w3.org/2000/svg", name);
  var key;
  for (key in attributes) {
    if (Object.prototype.hasOwnProperty.call(attributes, key)) {
      element.setAttribute(key, attributes[key]);
    }
  }
  return element;
}

function withAttributes(base, extra) {
  var result = {};
  var key;
  for (key in base) result[key] = base[key];
  for (key in extra) result[key] = extra[key];
  return result;
}

function outline(componentData) {
  var x = componentData.x;
  var y = currentData.height - componentData.y - componentData.height;
  var w = componentData.width;
  var h = componentData.height;
  var common = { class: "silhouette" + (componentData.selected ? " selected" : ""), "data-component-id": componentData.id };
  if (componentData.tabGroup) {
    var tabHeight = Math.min(32, h);
    var group = svgElement("g", common);
    group.appendChild(svgElement("rect", withAttributes(common, { class: common.class + " tab-group-frame", x: x, y: y, width: w, height: h })));
    group.appendChild(svgElement("rect", withAttributes(common, { class: common.class + " tab-group-header", x: x, y: y, width: w, height: tabHeight })));
    return group;
  }
  if (componentData.shape === "circle") {
    return svgElement("circle", withAttributes(common, { cx: x + w / 2, cy: y + h / 2, r: Math.min(w, h) / 2 }));
  }
  if (componentData.shape === "quarterCircle") {
    return svgElement("path", withAttributes(common, { d: "M " + (x + w) + " " + (y + h) + " L " + (x + w) + " " + y + " A " + w + " " + h + " 0 0 0 " + x + " " + (y + h) + " Z" }));
  }
  if (componentData.shape === "semicircle") {
    return svgElement("path", withAttributes(common, { d: "M " + x + " " + (y + h) + " A " + (w / 2) + " " + (w / 2) + " 0 0 1 " + (x + w) + " " + (y + h) + " Z" }));
  }
  if (componentData.shape === "slider") {
    var group = svgElement("g", common);
    group.appendChild(svgElement("rect", withAttributes(common, { x: x, y: y, width: w, height: h })));
    group.appendChild(svgElement("line", withAttributes(common, { x1: x + 6, y1: y + h / 2, x2: x + w - 6, y2: y + h / 2 })));
    group.appendChild(svgElement("circle", withAttributes(common, { cx: x + w / 2, cy: y + h / 2, r: Math.min(7, h / 2) })));
    return group;
  }
  if (componentData.shape === "switch") {
    var group = svgElement("g", common);
    group.appendChild(svgElement("rect", withAttributes(common, { x: x, y: y, width: w, height: h, rx: h * 0.5 })));
    group.appendChild(svgElement("circle", withAttributes(common, { cx: x + w * 0.25, cy: y + h * 0.5, r: h * 0.36 })));
    return group;
  }
  if (componentData.shape === "rockerSwitch") {
    var rocker = svgElement("g", common);
    rocker.appendChild(svgElement("rect", withAttributes(common, { x: x, y: y, width: w, height: h, rx: w * 0.5 })));
    rocker.appendChild(svgElement("line", withAttributes(common, { x1: x, y1: y + h / 2, x2: x + w, y2: y + h / 2 })));
    return rocker;
  }
  if (componentData.shape === "toggleSwitch") {
    var toggle = svgElement("g", common);
    toggle.appendChild(svgElement("rect", withAttributes(common, { x: x, y: y, width: w, height: h, rx: w * 0.5 })));
    toggle.appendChild(svgElement("circle", withAttributes(common, { cx: x + w / 2, cy: y + h * 0.25, r: Math.min(w * 0.35, h * 0.2) })));
    return toggle;
  }
  if (componentData.shape === "axes") {
    var group = svgElement("g", common);
    group.appendChild(svgElement("rect", withAttributes(common, { x: x, y: y, width: w, height: h })));
    group.appendChild(svgElement("line", withAttributes(common, { x1: x + w * 0.12, y1: y + h * 0.86, x2: x + w * 0.9, y2: y + h * 0.86 })));
    group.appendChild(svgElement("line", withAttributes(common, { x1: x + w * 0.12, y1: y + h * 0.86, x2: x + w * 0.12, y2: y + h * 0.1 })));
    return group;
  }
  return svgElement("rect", withAttributes(common, { x: x, y: y, width: w, height: h, rx: componentData.shape === "roundedRectangle" ? 8 : 0 }));
}

function addHandles(componentData, parent) {
  if (!componentData.selected) return;
  var x = componentData.x;
  var y = currentData.height - componentData.y - componentData.height;
  var w = componentData.width;
  var h = componentData.height;
  var positions = { sw: [x, y + h], s: [x + w / 2, y + h], se: [x + w, y + h], w: [x, y + h / 2], e: [x + w, y + h / 2], nw: [x, y], n: [x + w / 2, y], ne: [x + w, y] };
  var name;
  for (name in positions) {
    if (componentData.resizeConstraint === "fixedHeight" && (name === "n" || name === "s")) continue;
    if (componentData.resizeConstraint === "fixedWidth" && (name === "e" || name === "w")) continue;
    var point = positions[name];
    (parent || svg).appendChild(svgElement("rect", { class: "handle", x: point[0] - 4, y: point[1] - 4, width: 8, height: 8, "data-component-id": componentData.id, "data-handle": name, "data-resize-constraint": componentData.resizeConstraint || "" }));
  }
}

function addRootHandles(parent) {
  if (!currentData.rootId || (!currentData.rootEditable && !currentData.rootSelected)) return;
  var width = Number(currentData.width);
  var height = Number(currentData.height);
  var points = { "root-nw": [7, 7], "root-n": [width / 2, 7],
    "root-ne": [width - 7, 7], "root-w": [7, height / 2],
    "root-e": [width - 7, height / 2], "root-sw": [7, height - 7],
    "root-s": [width / 2, height - 7],
    "root-se": [width - 7, height - 7] };
  Object.keys(points).forEach(function(kind) {
    var point = points[kind];
    var handle = svgElement("rect", { class: "root-handle" +
      (currentData.rootEditable ? "" : " locked"), x: point[0] - 6,
      y: point[1] - 6, width: 12, height: 12,
      "data-component-id": currentData.rootId, "data-handle": kind });
    var title = svgElement("title", {});
    title.textContent = currentData.rootEditable ? "Resize UIFigure" :
      "UIFigure Position cannot be edited safely";
    handle.appendChild(title);
    (parent || svg).appendChild(handle);
  });
}

function componentArray(value) {
  if (!value) return [];
  if (Array.isArray(value)) return value;
  return [value];
}

function render() {
  if (!svg) return;
  var bounds = currentData.surfaceBounds || [0, 0, currentData.width || 1, currentData.height || 1];
  var top = currentData.height - Number(bounds[1]) - Number(bounds[3]);
  ["tab-controls", "grid-controls"].forEach(function(id) {
    var layer = document.getElementById(id);
    layer.style.width = currentData.width + "px";
    layer.style.height = currentData.height + "px";
    layer.style.transform = "translate(" + (-Number(bounds[0])) + "px," + (-top) + "px)";
  });
  var components = componentArray(currentData.components);
  var tabKey = JSON.stringify([currentData.height, components.filter(function(item) { return item.tabGroup; })],
    function(key, value) { return key === "selected" ? undefined : value; });
  if (tabKey !== tabControlsKey) {
    renderTabControls(components);
    tabControlsKey = tabKey;
  }
  var gridEditor = currentData.gridEditor;
  if (!gridChildHost && gridEditor && gridEditor.activeGridId) {
    document.getElementById("grid-controls").innerHTML = "";
    gridChildHost = document.createElement("div");
    gridTrackHost = document.createElement("div");
    gridChildHost.className = gridTrackHost.className = "grid-controls-layer";
    document.getElementById("grid-controls").appendChild(gridChildHost);
    document.getElementById("grid-controls").appendChild(gridTrackHost);
    gridControlsKey = trackControlsKey = "";
  }
  var trackKey = JSON.stringify([currentData.height, currentData.surfaceBounds, gridEditor],
    function(key, value) { return key === "revision" || key === "selected" ? undefined : value; });
  if (trackKey !== trackControlsKey) {
    closeTrackPopover();
    if (gridTrackHost) gridTrackHost.innerHTML = "";
    renderGridEditor(gridEditor, true);
    renderedGridEditor = gridEditor;
    trackControlsKey = trackKey;
  } else if (renderedGridEditor && gridEditor) {
    // Preserve focused track controls while advancing their event revision.
    renderedGridEditor.revision = gridEditor.revision;
  }
  var gridKey = JSON.stringify([currentData.height, currentData.gridSelectionTargets,
    currentData.gridEditor, currentData.gridPlacement, components.filter(function(item) { return item.inGrid; })],
    function(key, value) { return key === "revision" ? undefined : value; });
  if (gridKey !== gridControlsKey) {
    if (gridChildHost) gridChildHost.innerHTML = "";
    else document.getElementById("grid-controls").innerHTML = "";
    renderGridSelectionTargets(componentArray(currentData.gridSelectionTargets), currentData.gridEditor,
      currentData.gridPlacement);
    renderGridChildren(currentData.gridEditor);
    renderNestedGridComponents(components);
    renderGridPlacement(currentData.gridPlacement);
    renderedChildGridEditor = currentData.gridEditor;
    renderedGridPlacement = currentData.gridPlacement;
    gridControlsKey = gridKey;
  } else {
    // Existing event closures must use the current revision without losing native focus.
    if (renderedChildGridEditor && currentData.gridEditor) renderedChildGridEditor.revision = currentData.gridEditor.revision;
    if (renderedGridPlacement && currentData.gridPlacement) renderedGridPlacement.revision = currentData.gridPlacement.revision;
  }
  svg.setAttribute("viewBox", bounds[0] + " " + top + " " + bounds[2] + " " + bounds[3]);
  if (!selectionLayer && (components.length || currentData.rootId)) {
    selectionLayer = svgElement("g", {"data-layer": "selection"});
    rootLayer = svgElement("g", {"data-layer": "root"});
    svg.appendChild(selectionLayer);
    svg.appendChild(rootLayer);
  }
  var ids = new Set(components.map(function(item) { return item.id; }));
  outlineNodes.forEach(function(entry, id) {
    if (!ids.has(id)) { entry.node.remove(); outlineNodes.delete(id); }
  });
  components.forEach(function(item) {
    var key = JSON.stringify([currentData.height, item], function(name, value) {
      return name === "selected" ? undefined : value;
    });
    var entry = outlineNodes.get(item.id);
    if (!entry || entry.key !== key) {
      var node = outline(item);
      if (entry) entry.node.replaceWith(node);
      else if (svg.insertBefore) svg.insertBefore(node, selectionLayer);
      else svg.appendChild(node);
      entry = {node: node, key: key};
      outlineNodes.set(item.id, entry);
    }
    setOutlineSelection(entry.node, !!item.selected);
  });
  var order = JSON.stringify(components.map(function(item) { return item.id; }));
  if (order !== outlineOrder && svg.insertBefore) {
    components.forEach(function(item) { svg.insertBefore(outlineNodes.get(item.id).node, selectionLayer); });
    outlineOrder = order;
  }
  var selected = components.filter(function(item) { return item.selected; });
  var handlesKey = JSON.stringify([currentData.height, selected]);
  if (selectionLayer && handlesKey !== selectionKey) {
    selectionLayer.innerHTML = "";
    selected.forEach(function(item) { addHandles(item, selectionLayer); });
    selectionKey = handlesKey;
  }
  var rootHandlesKey = JSON.stringify([currentData.width, currentData.height, currentData.rootId,
    currentData.rootEditable, currentData.rootSelected]);
  if (rootLayer && rootHandlesKey !== rootKey) {
    rootLayer.innerHTML = "";
    addRootHandles(rootLayer);
    rootKey = rootHandlesKey;
  }
  acknowledgeRender();
}

function acknowledgeRender() {
  if (currentData.measureRender) {
    var revision = currentData.gridEditor && currentData.gridEditor.revision;
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        if (component && currentData.gridEditor && currentData.gridEditor.revision === revision) {
          component.sendEventToMATLAB("Rendered", {revision: revision});
        }
      });
    });
  }
}

function setOutlineSelection(node, selected) {
  if (node.classList && node.classList.contains("silhouette")) node.classList.toggle("selected", selected);
  Array.prototype.forEach.call(node.children || [], function(child) { setOutlineSelection(child, selected); });
}
</script>
</head>
